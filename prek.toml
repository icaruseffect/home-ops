# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

default_install_hook_types = ["pre-commit", "pre-push"]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v5.0.0"
hooks = [
  { id = "check-merge-conflict" },
  {
    id = "check-added-large-files",
    exclude = "gotk-components.yaml",
    args = ["--maxkb=200"]
  },
  { id = "detect-private-key" }
]

[[repos]]
repo = "https://github.com/adrienverge/yamllint"
rev = "v1.37.1"
hooks = [
  {
    id = "yamllint",
    args = [
      "-c",
      ".yamllint.yaml"
    ],
    files = '\.ya?ml$'
  }
]

[[repos]]
repo = "https://github.com/pre-commit/mirrors-prettier"
rev = "v4.0.0-alpha.8"
hooks = [
  {
    id = "prettier",
    args = [
      "--ignore-path",
      ".prettierignore",
      "--config",
      ".prettierrc.yaml"
    ]
  }
]

[[repos]]
repo = "https://github.com/k8s-at-home/sops-pre-commit"
rev = "v2.1.1"
hooks = [
  {
    id = "forbid-secrets",
    stages = ["pre-push"],
    exclude = """
(?x)^(
  kubernetes/talos-flux/apps/secops/vault-auth.yaml|
  kubernetes/talos-flux/apps/devops/tekton/triggers/interceptors.yaml|
  kubernetes/talos-flux/apps/devops/tekton/triggers/release.yaml
)$()
"""
  }
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "gitleaks"
name = "Detect hardcoded secrets"
language = "system"
entry = '''gitleaks git --pre-commit --redact --staged --verbose --config "${XDG_CONFIG_HOME:-$HOME/.config}/gitleaks/gitleaks.toml"'''
shell = "bash"
pass_filenames = false
stages = ["pre-commit", "pre-push"]

[[repos]]
repo = "https://github.com/tarioch/flux-check-hook"
rev = "v0.8.0"
hooks = [
  {
    id = "check-flux-helm-values",
    exclude = """
(?x)^(
  devenv/.*|
  kubernetes/talos-flux/apps/home-automation/esphome/app/config/.+.yaml|
  kubernetes/talos-flux/apps/home-automation/home-assistant/app/patches/db-init.yaml|
  kubernetes/talos-flux/apps/github/actions-runner-controller/.+/helm-release.yaml|
  kubernetes/kube-nas/.*
)$()
"""
  }
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "check-sops-encrypted",
    name = "Kubernetes Secrets must be sops-encrypted",
    entry = "scripts/check-sops-encrypted.sh",
    language = "system",
    files = '^kubernetes/.*\.ya?ml$'
  },
  {
    id = "terraform-fmt",
    name = "terraform fmt (check only)",
    entry = "scripts/terraform-fmt-check.sh",
    language = "system",
    files = '^infra/terraform/.*\.tf$',
    exclude = '^infra/terraform/contabo/talos-disk-install\.tf$'
  }
]
