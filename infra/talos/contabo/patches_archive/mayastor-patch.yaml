#mayastor-patch.yaml
- op: add
  path: /machine/sysctls
  value:
    vm.nr_hugepages: "1024"
- op: add
  path: /machine/nodeLabels
  value:
    openebs.io/engine: mayastor
- op: add
  path: /machine/kubelet/extraMounts
  value:
  - destination: /var/local/openebs
    type: bind
    source: /var/local/openebs
    options:
    - bind
    - rshared
    - rw
