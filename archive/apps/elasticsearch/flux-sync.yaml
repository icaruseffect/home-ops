---
apiVersion: kustomize.toolkit.fluxcd.io/v1beta2
kind: Kustomization
metadata:
  name: elasticsearch
  namespace: flux-system
spec:
  interval: 1h
  sourceRef:
    kind: GitRepository
    name: flux-system # Assumes your main Git repository is called flux-system
  path: kubernetes/talos-flux/apps/database/elasticsearch/app # Path to the directory containing Elasticsearch configuration
  prune: true
  wait: true
  timeout: 5m
