---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: elasticsearch
  namespace: database
spec:
  interval: 1h
  chart:
    spec:
      chart: elasticsearch
      version: "8.x" # Using the 8.x version range as requested
      sourceRef:
        kind: HelmRepository
        name: elastic-charts
        namespace: flux-system
  values:
    # Basic configuration example - modify as needed
    replicas: 1
    minimumMasterNodes: 1

    # Configure PDB for single node setup
    maxUnavailable: 0

    pdb:
      create: false

    # Resource requirements
    resources:
      # requests:
      #   cpu: "1"
      #   memory: "2Gi"
      limits:
        cpu: "2"
        memory: "4Gi"

    # Additional pod security context
    podSecurityContext:
      fsGroup: 1000
      runAsUser: 1000

    # Set seccomp profile to make pod security compliant
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault

    # Storage configuration
    volumeClaimTemplate:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi

    # Security settings
    antiAffinity: "soft"

    clusterHealthCheckParams: "wait_for_status=yellow&timeout=1s"

    # Set up basic security with modified security settings
    esConfig:
      elasticsearch.yml: |
        xpack.security.enabled: true
        xpack.security.transport.ssl.enabled: true

        # Disable bootstrap system checks for container compatibility
        node.store.allow_mmap: false

    # Disable privileged sysctlInitContainer to comply with PodSecurity baseline policy
    sysctlInitContainer:
      enabled: false

    # Configure security settings to address permission issues
    extraEnvs:
      - name: ES_JAVA_OPTS
        value: "-Dlog4j2.formatMsgNoLookups=true"
      - name: ELASTIC_PASSWORD
        valueFrom:
          secretKeyRef:
            name: elasticsearch-nextcloud-user
            key: password
      # Configure users
      - name: ELASTIC_PASSWORD
        valueFrom:
          secretKeyRef:
            name: elasticsearch-nextcloud-user
            key: password
      - name: ES_GCLOG_DISABLE
        value: "true"
      - name: ES_NET_HOST
        value: "_local_,_site_"

    # Set bootstrap checks to false to allow running in containers
    # esJavaOpts: "-Xmx2g -Xms2g -Des.enforce.bootstrap.checks=false"
    esJavaOpts: "-Xms512m -Xmx512m -Des.enforce.bootstrap.checks=false"

    ingest:
      enabled: false
    ml:
      enabled: false

    clusterSettings:
      indices.recovery.max_bytes_per_sec: "50mb"
      cluster.routing.allocation.disk.threshold_enabled: "true"
      cluster.routing.allocation.disk.watermark.low: "90%"
      cluster.routing.allocation.disk.watermark.high: "95%"
      cluster.routing.allocation.disk.watermark.flood_stage: "97%"

    # Disable system call filter (for Elasticsearch 8.x)
    sysctlVmMaxMapCount: 262144

    # Add additional Elasticsearch configuration as needed

    # Network policy to allow access from the cloud namespace
    # networkPolicy:
    #   http:
    #     enabled: true
    #     ingress:
    #       - from:
    #           - namespaceSelector:
    #               matchLabels:
    #                 kubernetes.io/metadata.name: cloud

    # Use internal user database for authentication
    secret:
      enabled: true


    terminationGracePeriod: 120
    # Create the nextcloud user on startup
    lifecycle:
      # Create users after startup using the elasticsearch-users tool
      postStart:
        exec:
          command:
            - bash
            - -c
            - |
              #!/bin/bash
              # Wait for Elasticsearch to be ready
              until curl -s -X GET http://localhost:9200/ > /dev/null; do 
                echo "Waiting for Elasticsearch to start..."
                sleep 5
              done

              # Create the nextcloud user using the elasticsearch-users utility
              echo "Creating nextcloud user..."
              /usr/share/elasticsearch/bin/elasticsearch-users useradd nextcloud -p ${ELASTIC_PASSWORD} -r superuser
      preStop:
        exec:
          command: ["/bin/sh", "-c", "sleep 20; curl -XPOST 'http://localhost:9200/_cluster/nodes/_local/_shutdown' || true"]
