---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: shiori
  namespace: shiori
spec:
  interval: 30m
  chart:
    spec:
      chart: shiori
      version: "1.x"
      sourceRef:
        kind: HelmRepository
        name: nicholaswilde-charts
        namespace: flux-system
  values:
    env:
      TZ: ${SETTING_TZ}
    persistence:
      data:
        enabled: true
        emptyDir: false
        mountPath: /data
        accessMode: ReadWriteOnce
        size: 15Gi
    postgres:
      enabled: false
      secret:
        POSTGRES_PASSWORD: "shiori-pass"
      env:
        POSTGRES_USER: "shiori"
        POSTGRES_DB: "shiori-postgres"
      fullnameOverride: shiori-postgres
