---
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: device-plugin-operator
  namespace: kube-system
spec:
  interval: 5m
  chart:
    spec:
      chart: intel-device-plugins-operator
      version: 0.x
      sourceRef:
        kind: HelmRepository
        name: intel-charts
        namespace: flux-system
  values:
    manager:
      devices:
        gpu: true
