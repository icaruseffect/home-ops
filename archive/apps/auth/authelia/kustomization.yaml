      - 'OIDC_ISSUER_PRIVATE_KEY'
      - 'REDIS_PASSWORD'
      - 'REDIS_SENTINEL_PASSWORD'
      - 'SESSION_SECRET'
      - 'SMTP_PASSWORD'
      - 'STORAGE_ENCRYPTION_KEY'
      - 'STORAGE_PASSWORD'
...
