apiVersion: v1
kind: LimitRange
metadata:
  name: longhorn-limits
  namespace: longhorn-system
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m" # Much lower than current 480m
        memory: "128Mi"
      max:
        cpu: "1"
        memory: "1Gi"
