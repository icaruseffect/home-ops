---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  setup:
    - task: config
    - task: kubeconfig
    - task: patch
    - task: apply-config

  init:
    desc: Initialize talos configuration
    dir: infra/talos
    cmds:
      # https://github.com/budimanjojo/talhelper
      - "talhelper gensecret > talsecret.sops.yaml"
      - "sops -e -i talsecret.sops.yaml"

  config:
    desc: Let talhelper generate the configuration files
    dir: infra/talos
    cmds:
      - "talhelper genconfig"

  secrets:decrypt:
    desc: Decrypt age-encrypted talos machineconfig secrets to plaintext (gitignored artifacts)
    dir: infra/talos/contabo
    cmds:
      - |
        set -e
        for f in controlplane.sops.yaml worker.sops.yaml patches/*.sops.yaml; do
          plain="${f%.sops.yaml}.yaml"
          sops -d "$f" > "$plain.tmp"
          mv "$plain.tmp" "$plain"
        done
    preconditions:
      - sh: which sops >/dev/null 2>&1
        msg: sops not found in PATH
      - test -f controlplane.sops.yaml
      - test -f worker.sops.yaml
      - sh: ls patches/*.sops.yaml >/dev/null 2>&1
        msg: no encrypted patches found

  secrets:encrypt:
    desc: Re-encrypt plaintext machineconfig secrets back to .sops.yaml (after manual edits)
    dir: infra/talos/contabo
    cmds:
      - |
        set -e
        for f in controlplane.sops.yaml worker.sops.yaml patches/*.sops.yaml; do
          plain="${f%.sops.yaml}.yaml"
          test -f "$plain" || { echo "missing plaintext: $plain"; exit 1; }
          sops -e --filename-override "$f" "$plain" > "$f.tmp"
          mv "$f.tmp" "$f"
        done

  secrets:clean:
    desc: Enforce sops-only talos-flux secrets on disk (plaintext artifacts removed)
    dir: infra/talos/contabo
    preconditions:
      - sh: test -f controlplane.sops.yaml && test -f worker.sops.yaml && test -f patches/wireguard-secret.sops.yaml
        msg: encrypted machineconfigs missing
    cmds:
      - cmd: |
          set -e
          for f in controlplane.sops.yaml worker.sops.yaml patches/*.sops.yaml; do
            base="${f%.sops.yaml}"
            sops filestatus "$f" | grep -q '"encrypted":true' || { echo "NOT ENCRYPTED: $f"; exit 1; }
            if test -f "$base.yaml"; then
              sops -d "$f" | diff -q - "$base.yaml" >/dev/null || { echo "PLAINTEXT DRIFT: $base.yaml not archived — run secrets:encrypt first"; exit 1; }
            fi
          done
          rm -f controlplane.yaml worker.yaml \
                machineconfig_patched.yaml machineconfig_live*.yaml machineconfig_tmp \
                admin.crt admin.csr admin.key ca.crt ca.key kubeconfig talosconfig*
          # only the decrypted twins of patches/*.sops.yaml; tracked plaintext patches stay
          for f in patches/*.sops.yaml; do rm -f "${f%.sops.yaml}.yaml"; done

  patch:copy-mc:
    dir: infra/talos/contabo
    deps: [secrets:decrypt]
    cmds:
      - cmd: cp controlplane.yaml machineconfig_patched.yaml

  patch:
    desc: Patch the machineconfig file
    dir: infra/talos/contabo
    deps: [patch:copy-mc]
    # go-task `excludes` filters included tasks, not `sources` — loop explicitly
    # over plaintext patches so `*.sops.yaml` never reaches talosctl
    run: always
    cmds:
      - cmd: |
          set -e
          for p in $(find patches -maxdepth 1 -type f -name '*.yaml' ! -name '*.sops.yaml' | sort); do
            echo "applying $p"
            talosctl mc patch machineconfig_patched.yaml --patch @"$p" > /tmp/machineconfig_tmp && cp /tmp/machineconfig_tmp machineconfig_patched.yaml
          done
          rm -f /tmp/machineconfig_tmp
      - cmd: rm -f controlplane.yaml worker.yaml && for f in patches/*.sops.yaml; do rm -f "${f%.sops.yaml}.yaml"; done
    preconditions:
      # if template and patched file are the same after copying the template run the patches
      - sh: "[[ $(sha256sum machineconfig_patched.yaml | awk '{ print $1 }') = $(sha256sum controlplane.yaml | awk '{ print $1 }' ) ]]"
    requires:
      vars:
        - TALOSCONFIG

  bootstrap:apply-config-insecure:
    desc: Install contabo
    dir: infra/talos/contabo
    cmds:
      - |
        talosctl apply-config --insecure \
          --file machineconfig_patched.yaml \
          --nodes $NODE_IP
      - task: secrets:clean

  bootstrap:apply-config-secure:
    desc: Install contabo
    dir: infra/talos/contabo
    cmds:
      - |
        talosctl apply-config  \
          --file machineconfig_patched.yaml \
          --nodes $NODE_IP
      - task: secrets:clean

  update:talos01:
    desc: Update talos01
    dir: infra/talos
    cmds:
      - |
        talosctl apply-config \
          --nodes 192.168.1.51 \
          --file clusterconfig/talos-flux-talos01.yaml

  bootstrap:etcd:
    desc: Bootstrap talos etcd on contabo
    dir: infra/talos
    cmds:
      - |
        talosctl bootstrap \
          --talosconfig=clusterconfig/talosconfig \
          --nodes $NODE_IP

  kubeconfig:
    desc: write kube config
    dir: infra/talos
    cmds:
      - |
        talosctl kubeconfig \
          --talosconfig=$TALOSCONFIG \
          --force

  bootstrap:network:
    dir: kubernetes/talos-flux/
    cmds:
      - kubectl kustomize --enable-helm  --helm-command=$(which helm) bootstrap/cilium | kubectl apply -n kube-system -f -

  bootstrap:flux:
    dir: kubernetes/talos-flux/
    cmds:
      - kubectl apply --server-side -k flux/flux-manifests
      - sops decrypt flux/config/sops-age.sops.yaml | kubectl apply -n flux-system -f -
      - sops decrypt flux/config/cluster-secrets.sops.yaml | kubectl apply -n flux-system -f -
      - sops decrypt flux/config/github-ssh.sops.yaml | kubectl apply -n flux-system -f -
      - kubectl apply --server-side -f flux/repositories/home-ops.yaml
      - kubectl apply --server-side -f flux/flux-sync.yaml
      - kubectl apply --server-side -f flux/apps-sync.yaml

  cilium:delete-unmanaged-pods:
    cmd: kubectl get pods --all-namespaces -o custom-columns=NAMESPACE:.metadata.namespace,NAME:.metadata.name,HOSTNETWORK:.spec.hostNetwork --no-headers=true | grep '<none>' | awk '{print "-n "$1" "$2"}' | xargs -L 1 -r kubectl delete pod

  cilium:rollOutRestart:
    cmd: kubectl -n kube-system rollout restart deployment/cilium-operator daemonset/cilium daemonset/cilium-envoy

  # dashboard:
  #   desc: start the theila dashboard
  #   cmds:
  #     - theila --address 127.0.0.1 --port 8080

  # https://www.talos.dev/v1.2/advanced/disaster-recovery/
  backup:etcd:
    desc: backup etcd from ip 192.168.1.51
    cmds:
      - talosctl -n 192.168.1.51 etcd snapshot db.snapshot

  dashboard:
    desc: Dashboard talos01
    dir: infra/talos
    cmds:
      - talosctl dashboard --nodes {{.hostname}}
    requires:
      vars:
        - hostname

  dashboard:talos01:
    desc: Dashboard talos01
    dir: infra/talos
    cmds:
      - |
        talosctl dashboard \
          --nodes 192.168.1.51
  reset:
    desc: Reset the machine and delete STATE and EPHEMERAL partition
    cmd: talosctl reset  --graceful=false  --system-labels-to-wipe STATE --system-labels-to-wipe EPHEMERAL --reboot

  upgrade:
    # usage: task talos:upgrade hostname=192.168.1.51 cluster=talos-flux
    desc: Upgrade talos on a node
    dir: infra/talos
    prompt: do you want to upgrade talos to {{.TALOS_VERSION}} on node {{.hostname}}?
    cmds:
      - until kubectl --context {{.KUBE_CONTEXT}} wait --timeout=5m --for=condition=Complete jobs --all --all-namespaces; do sleep 10; done
      - talosctl --context {{.cluster}} --nodes {{.hostname}} upgrade --image="ghcr.io/siderolabs/installer:{{.TALOS_VERSION}}" --wait=true --timeout=10m --preserve=true
      - talosctl --context {{.cluster}} --nodes {{.hostname}} health --wait-timeout=10m --server=false
      - until kubectl --context {{.KUBE_CONTEXT}} wait --timeout=5m --for=jsonpath=.status.ceph.health=HEALTH_OK cephcluster --all --all-namespaces; do sleep 10; done
    vars:
      TALOS_VERSION:
        sh: yq 'select(document_index == 0).talosVersion' {{.TALOS_DIR}}/talconfig.yaml
      KUBERNETES_VERSION:
        sh: yq 'select(document_index == 0).kubernetesVersion' {{.TALOS_DIR}}/talconfig.yaml
      # CONTROLLER:
      #   sh: talosctl --context {{.cluster}} config info --output json | jq --raw-output '.endpoints[]' | shuf -n 1
      KUBE_CONTEXT:
        sh: echo admin@{{.cluster}}
    requires:
      vars:
        - cluster
        - hostname
    preconditions:
      - test -f {{.TALOS_DIR}}/talconfig.yaml
      - talosctl --context {{.cluster}} config info >/dev/null 2>&1
      - talosctl --context {{.cluster}} --nodes {{.hostname}} get machineconfig >/dev/null 2>&1

  kubelet:upgrade:
    desc: Upgrade kubelet on a node
    dir: infra/talos
    prompt: do you want to upgrade kubelet to {{.KUBELET_VERSION}} on node {{.hostname}}?
    cmds:
      - task: config
      - until kubectl --context {{.KUBE_CONTEXT}} wait --timeout=5m --for=jsonpath=.status.ceph.health=HEALTH_OK cephcluster --all --all-namespaces; do sleep 10; done
      - talosctl apply --nodes {{.ip }} --file clusterconfig/talos-flux-{{.hostname }}.yaml
      - talosctl --context {{.cluster}} --nodes {{.ip}} health --wait-timeout=10m --server=false
      - until kubectl --context {{.KUBE_CONTEXT}} wait --timeout=5m --for=jsonpath=.status.ceph.health=HEALTH_OK cephcluster --all --all-namespaces; do sleep 10; done
    vars:
      KUBE_CONTEXT:
        sh: echo admin@{{.cluster}}
      KUBERNETES_VERSION:
        sh: yq 'select(document_index == 0).kubernetesVersion' {{.TALOS_DIR}}/talconfig.yaml
    requires:
      vars:
        - cluster
        - hostname
        - ip
    preconditions:
      - test -f {{.TALOS_DIR}}/talconfig.yaml
      - talosctl --context {{.cluster}} config info >/dev/null 2>&1
      - talosctl --context {{.cluster}} --nodes {{.ip}} get machineconfig >/dev/null 2>&1

  # ============================================================================
  # Certificate Renewal Tasks
  # ============================================================================

  renew:talosconfig:
    desc: Renew talos client certificate via live CSR signing (endpoint from machineconfig)
    dir: infra/talos/contabo
    prompt: This will regenerate your talosconfig with a new client certificate. Continue?
    cmds:
      - |
        set -e
        echo "Creating backup of current talosconfig..."
        TIMESTAMP=$(date +%Y%m%d-%H%M%S)
        cp talosconfig talosconfig.backup.${TIMESTAMP}
        echo "Backup created: talosconfig.backup.${TIMESTAMP}"
      - |
        set -e
        ENDPOINT=$(yq '.cluster.controlPlane.endpoint' machineconfig_patched.yaml | tr -d '"' | sed -e 's|https://||' -e 's|:[0-9]*$||')
        echo "Regenerating talosconfig via live CSR signing (endpoint: $ENDPOINT)..."
        # talosctl removed offline CA-based config generation; the API signs the new client cert
        talosctl --talosconfig talosconfig config new \
          --roles os:admin \
          --endpoints "$ENDPOINT" \
          --nodes "$ENDPOINT" \
          talosconfig.new
        talosctl --talosconfig talosconfig.new config endpoint "$ENDPOINT"
        mv talosconfig.new talosconfig
        echo "New talosconfig generated successfully"
      - |
        set -e
        ENDPOINT=$(yq '.cluster.controlPlane.endpoint' machineconfig_patched.yaml | tr -d '"' | sed -e 's|https://||' -e 's|:[0-9]*$||')
        echo "Verifying talosctl connection with the regenerated config..."
        talosctl --talosconfig talosconfig --endpoints "$ENDPOINT" version --nodes "$ENDPOINT"
        echo "Talos certificate renewed and verified successfully"
      - task: secrets:clean
    preconditions:
      - test -f talosconfig
      - test -f machineconfig_patched.yaml
      - sh: "which talosctl >/dev/null 2>&1"
        msg: "talosctl not found in PATH"
      - sh: "which yq >/dev/null 2>&1"
        msg: "yq not found in PATH"

  renew:kubeconfig:
    desc: Renew kubectl configuration by regenerating from talos
    dir: infra/talos/contabo
    prompt: This will regenerate your kubeconfig. Continue?
    cmds:
      - |
        set -e
        if test -f ~/.kube/config; then
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          cp ~/.kube/config ~/.kube/config.backup.${TIMESTAMP}
          echo "Backup created: ~/.kube/config.backup.${TIMESTAMP}"
        else
          echo "No existing ~/.kube/config to backup"
        fi
      - |
        set -e
        echo "Generating new kubeconfig..."
        talosctl kubeconfig --talosconfig=talosconfig --force
        echo "Kubeconfig generated successfully"
      - |
        set -e
        echo "Verifying kubectl connection..."
        kubectl version --output=json | jq -r '.serverVersion.gitVersion'
        echo "Kubeconfig renewed and verified successfully"
    preconditions:
      - test -f talosconfig
      - sh: "which talosctl >/dev/null 2>&1"
        msg: "talosctl not found in PATH"
      - sh: "which kubectl >/dev/null 2>&1"
        msg: "kubectl not found in PATH"
      - sh: "which jq >/dev/null 2>&1"
        msg: "jq not found in PATH"

  renew:all:
    desc: Renew both talosconfig and kubeconfig certificates
    cmds:
      - task: renew:talosconfig
      - task: renew:kubeconfig
      - |
        echo "=========================================="
        echo "All certificates renewed successfully!"
        echo "=========================================="
