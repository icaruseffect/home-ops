---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: seaweedfs
  namespace: flux-system
spec:
  targetNamespace: storage
  interval: 30m
  timeout: 10m
  path: ./kubernetes/apps/storage/seaweedfs/app
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  decryption:
    provider: sops
    secretRef:
      name: sops-age
