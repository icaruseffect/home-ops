---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs
spec:
  interval: 30m
  chart:
    spec:
      chart: seaweedfs
      version: 4.40.0
      sourceRef:
        kind: HelmRepository
        name: seaweedfs
        namespace: flux-system
  maxHistory: 3
  install:
    remediation: { retries: 3 }
  upgrade:
    cleanupOnFail: true
    remediation: { retries: 3 }
  values:
    # all-in-one replaces the separate master/volume/filer/s3 deployments
    master: { enabled: false }
    volume: { enabled: false }
    filer: { enabled: false }
    s3: { enabled: false }

    global:
      seaweedfs:
        # single node: no replication is possible, be explicit about it
        enableReplication: false
        replicationPlacement: "000"

    allInOne:
      enabled: true
      replicas: 1
      updateStrategy:
        type: Recreate
      metricsPort: 9324
      s3:
        enabled: true
        port: 8333
        enableAuth: true
        existingConfigSecret: seaweedfs-s3-config
        createBuckets:
          - name: cnpg
            versioning: Enabled
          - name: thanos
          - name: loki
      data:
        type: hostPath
        hostPathPrefix: /var/local/seaweedfs
      resources:
        requests: { cpu: 500m, memory: 1Gi }
        limits: { memory: 3Gi }
      affinity: ""
