---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tesserae
  namespace: tesserae
  labels:
    app: tesserae
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tesserae
  template:
    metadata:
      labels:
        app: tesserae
    spec:
      containers:
        - name: tesserae
          image: ghcr.io/dmellok/tesserae:0.436.1
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 512Mi
          ports:
            - name: http
              containerPort: 8765
              # e-ink panels fetch rendered frames from <node-ip>:8765
              hostPort: 8765
          env:
            - name: TESSERAE_IN_DOCKER
              value: "1"
            # Pin before storing any credentials (broker password etc.):
            # otherwise the encryption key is derived from settings.json.
            - name: TESSERAE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tesserae-secrets
                  key: TESSERAE_SECRET_KEY
            # Frame URLs pushed to panels must point at an address they can reach.
            - name: TESSERAE_HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tesserae-data
