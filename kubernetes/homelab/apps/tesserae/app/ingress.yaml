---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tesserae
  namespace: tesserae
  labels:
    app: tesserae
  annotations:
    cert-manager.io/cluster-issuer: ca-issuer
    k8s-gateway.dns/hostname: tesserae.lab.lan
spec:
  ingressClassName: cilium
  tls:
    - hosts:
        - tesserae.lab.lan
      secretName: tesserae-tls
  rules:
    - host: tesserae.lab.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tesserae
                port:
                  number: 80
