---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/apps.emqx.io/emqx_v2beta1.json
apiVersion: apps.emqx.io/v2beta1
kind: EMQX
metadata:
  name: emqx
  namespace: homeautomation
spec:
  image: emqx:5
  # config:
  #   data: |
  #     authentication {
  #       backend = "built_in_database"
  #       mechanism = "password_based"
  #       password_hash_algorithm {
  #           name = "bcrypt"
  #       }
  #       user_id_type = "username"
  #       bootstrap_file = "/opt/init-user.json"
  #       bootstrap_type = "plain"
  #     }
  #     authorization {
  #       sources = [
  #         {
  #           type = built_in_database
  #           enable = true
  #         }
  #       ]
  #       no_match: "deny"
  #     }
  coreTemplate:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      replicas: 1
      # envFrom:
      #   - secretRef:
      #       name: emqx-secret
      # extraVolumeMounts:
      #   - name: init-user
      #     mountPath: /opt/init-user.json
      #     subPath: init-user.json
      #     readOnly: true
      # extraVolumes:
      #   - name: init-user
      #     secret:
      #       secretName: emqx-init-user-secret
      volumeClaimTemplates:
        storageClassName: openebs-hostpath
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 500Mi
  listenersServiceTemplate:
    metadata:
      annotations:
        lbipam.cilium.io/ips: "192.168.8.21"
        k8s-gateway.dns/hostname: mqtt.lab.lan
      labels:
        homelab/public-service: "true"
    spec:
      type: LoadBalancer
      ipFamilyPolicy: PreferDualStack
      ipFamilies:
        - IPv4
        - IPv6
