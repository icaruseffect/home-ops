---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-5.0.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mosquitto
  namespace: mosquitto
spec:
  chart:
    spec:
      chart: app-template
      version: 5.0.0
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        namespace: flux-system
        name: bjw-s-charts
  interval: 1h
  driftDetection:
    mode: enabled
  values:
    controllers:
      mosquitto:
        annotations:
          secret.reloader.stakater.com/reload: mosquitto-auth,mosquitto-tls
        initContainers:
          init-mosquitto-perms:
            image:
              repository: busybox
              tag: 1.36
            command:
              - sh
              - -c
              - |
                cp /secrets/passwd /work/passwd
                cp /secrets/aclfile /work/aclfile
                chmod 0440 /work/passwd /work/aclfile
            securityContext:
              runAsUser: 1883
              runAsGroup: 1883
              allowPrivilegeEscalation: false
              capabilities: { drop: [ALL] }
        containers:
          app:
            image:
              repository: eclipse-mosquitto
              tag: 2.1.2-alpine
              pullPolicy: IfNotPresent
            command: [mosquitto, -c, /mosquitto/config/mosquitto.conf]
            env:
              TZ: Europe/Berlin
            # Guaranteed QoS (request == limit): actual usage is ~10Mi, so
            # 32Mi is real headroom, not padding. This is the most important
            # of the three home-automation services (per user), so it gets
            # the strongest available protection from the node's OOM killer.
            resources:
              requests:
                cpu: 20m
                memory: 32Mi
              limits:
                cpu: 20m
                memory: 32Mi
            probes:
              liveness: &probe
                enabled: true
                port: 1883
              readiness: *probe
              startup:
                <<: *probe
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            securityContext:
              readOnlyRootFilesystem: true
              runAsUser: 1883
              runAsGroup: 1883
              allowPrivilegeEscalation: false
              capabilities: { drop: [ALL] }
        pod:
          priorityClassName: homelab-critical
          securityContext:
            fsGroup: 1883
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
          labels:
            policy.gabe565.com/egress-world: "true"
            policy.gabe565.com/ingress-world: "true"

    service:
      mosquitto:
        controller: mosquitto
        type: LoadBalancer
        # loadBalancerIP: 192.168.8.
        externalTrafficPolicy: Local
        annotations:
          # external-dns.alpha.kubernetes.io/hostname: ${app_url}
          homelab/public-service: "true"
        ports:
          mqtts:
            port: 8883

    persistence:
      data:
        suffix: data
        # storageClass: longhorn-ssd
        accessMode: ReadWriteOnce
        size: 64Mi
        advancedMounts:
          mosquitto:
            app:
              - path: /mosquitto/data

      config:
        type: configMap
        identifier: config
        advancedMounts:
          mosquitto:
            app:
              - path: /mosquitto/config/mosquitto.conf
                subPath: mosquitto.conf

      # Raw Secret, read-only — only the init container ever sees this directly.
      auth-src:
        type: secret
        name: mosquitto-auth
        advancedMounts:
          mosquitto:
            init-mosquitto-perms:
              - path: /secrets
                readOnly: true

      # Writable staging area. Init container writes here at /work.
      # App container mounts the SAME files via subPath directly onto
      # the final config paths Mosquitto reads from.
      auth-work:
        type: emptyDir
        advancedMounts:
          mosquitto:
            init-mosquitto-perms:
              - path: /work
            app:
              - path: /mosquitto/config/passwd
                subPath: passwd
                readOnly: true
              - path: /mosquitto/config/aclfile
                subPath: aclfile
                readOnly: true

      tls:
        type: secret
        name: mosquitto-tls

    configMaps:
      config:
        enabled: true
        data:
          mosquitto.conf: |
            log_dest stderr
            log_type error
            log_type warning

            listener 1883
            allow_anonymous false
            plugin /usr/lib/mosquitto_password_file.so
            plugin_opt_password_file /mosquitto/config/passwd
            plugin /usr/lib/mosquitto_acl_file.so
            plugin_opt_acl_file /mosquitto/config/aclfile

            listener 8883
            allow_anonymous false
            plugin /usr/lib/mosquitto_password_file.so
            plugin_opt_password_file /mosquitto/config/passwd
            plugin /usr/lib/mosquitto_acl_file.so
            plugin_opt_acl_file /mosquitto/config/aclfile
            cafile /tls/ca.crt
            certfile /tls/tls.crt
            keyfile /tls/tls.key

            persistence true
            persistence_location /mosquitto/data
            autosave_interval 1800
