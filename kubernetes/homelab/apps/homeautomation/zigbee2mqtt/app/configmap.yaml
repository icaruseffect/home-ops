---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zigbee2mqtt-settings
  namespace: homeautomation
data:
  configuration.yaml: |
    # Home Assistant integration
    homeassistant: true

    # Allow new devices to join
    permit_join: true

    # MQTT settings
    mqtt:
      base_topic: zigbee2mqtt
      server: "mqtt://router.lan"
      user: zigbee2mqtt
      password: 'Fd34Aiud2~co77~7'
      include_device_information: true

    # Serial settings
    serial:
      port: /dev/ttyACM0

    # Advanced settings
    advanced:
      network_key: GENERATE
      log_output:
        - console
      log_level: info
      last_seen: 'ISO_8601'
      homeassistant_discovery_topic: 'homeassistant'
      homeassistant_status_topic: 'homeassistant/status'

    # Frontend settings
    frontend:
      port: 8080

    # Experimental features
    experimental:
      new_api: true
