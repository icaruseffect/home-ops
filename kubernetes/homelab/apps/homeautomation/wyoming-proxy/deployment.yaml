---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wyoming-openai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wyoming-openai
  template:
    metadata:
      labels:
        app: wyoming-openai
    spec:
      containers:
        - name: wyoming-openai
          image: ghcr.io/roryeckel/wyoming_openai:latest
          ports:
            - containerPort: 10300
          env:
            - name: WYOMING_URI
              value: "tcp://0.0.0.0:10300"
            - name: WYOMING_LOG_LEVEL
              # value: "INFO"
              value: "DEBUG"
            - name: WYOMING_LANGUAGES
              value: "de en"
            - name: STT_OPENAI_URL
              value: "http://localai-local-ai.localai:8080/v1/"
            - name: STT_MODELS
              value: "whisper-1"
            - name: TTS_OPENAI_URL
              value: "http://localai-local-ai.localai:8080/v1/"
            - name: TTS_MODELS
              value: "whisper-small whisper-1"
            - name: TTS_VOICES
              value: "voice-de-karlsson-low voice-de-thorsten-low"
