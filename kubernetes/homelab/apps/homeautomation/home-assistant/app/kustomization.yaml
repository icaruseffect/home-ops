apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homeautomation
resources:
  # - database.yaml
  # - home-assistant-ssh.sops.yaml
  # - home-assistant-secrets.sops.yaml
  # - storage-class.yaml
  # - persistent-volume.yaml
  # - persistent-volume-claim.yaml
  - helm-repo.yaml
  - helm-release.yaml
  - pvc-backups.yaml
  - cm-home-assistant.yaml
  - secret-homeassistant-db.sops.yaml
  # - cm-home-intermediate-ca.yaml
  # - networkattachmentdefinition.yaml
configMapGenerator:
  - name: home-assistant-values
    files:
      - home-assistant-values.yaml
    options:
      disableNameSuffixHash: true
