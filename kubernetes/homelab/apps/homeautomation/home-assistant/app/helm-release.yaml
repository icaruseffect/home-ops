---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homeassistant
  namespace: homeautomation
spec:
  interval: 5m
  chart:
    spec:
      chart: home-assistant
      version: "0.x"
      sourceRef:
        kind: HelmRepository
        name: home-assistant-chart
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: home-assistant-values
      valuesKey: home-assistant-values.yaml
