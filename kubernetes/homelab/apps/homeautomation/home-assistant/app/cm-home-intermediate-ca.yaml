---
apiVersion: v1
data:
  Home_Intermediate_CA_fullchain.pem: |
    # Placeholder for Home_Intermediate_CA_fullchain.pem
    # Replace this content with the actual intermediate CA fullchain certificate
    # The fullchain should include:
    # - Intermediate CA certificate
    # - Any additional intermediate certificates needed to chain to root
    #
    # Example format:
    # -----BEGIN CERTIFICATE-----
    # MIIFazCCBFOgAwIBAgIJAKq5D2jG2... (actual certificate content here)
    # -----END CERTIFICATE-----
    #
    # IMPORTANT: Replace this placeholder with the actual CA content before deployment
kind: ConfigMap
metadata:
  name: home-intermediate-ca
  namespace: homeautomation
  annotations:
    # Trust-manager annotations for automatic bundle creation
    trust-manager.io/bundle: home-intermediate-ca
    trust-manager.io/target-namespace: homeautomation
    trust-manager.io/target-kind: ConfigMap
  labels:
    app.kubernetes.io/name: home-assistant
    app.kubernetes.io/component: trust
    app.kubernetes.io/managed-by: kustomize
