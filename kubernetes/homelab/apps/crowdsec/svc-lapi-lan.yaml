---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/service.json
# Exposes the CrowdSec LAPI to the LAN so remote remediation components (e.g.
# the crowdsec-firewall-bouncer on the OpenWrt router) can reach it. NodePort
# 30516 -> lapi 8080.
apiVersion: v1
kind: Service
metadata:
  name: crowdsec-lapi-lan
  namespace: crowdsec
  labels:
    app.kubernetes.io/name: crowdsec
    app.kubernetes.io/component: lapi
spec:
  type: NodePort
  selector:
    k8s-app: crowdsec
    type: lapi
  ports:
    - name: lapi
      port: 8080
      targetPort: 8080
      nodePort: 30516
      protocol: TCP
