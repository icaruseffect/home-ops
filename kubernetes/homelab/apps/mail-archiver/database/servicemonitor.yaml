---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mail-archiver-postgres
  namespace: mail-archiver
  labels:
    app: mail-archiver-postgres
    release: prometheus
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: mail-archiver-postgres-cluster
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
      scheme: http
  namespaceSelector:
    matchNames:
      - mail-archiver
