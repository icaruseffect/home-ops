---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mail-archiver-postgres-cluster
  namespace: mail-archiver
  annotations:
    k8up.io/backup: "true"
spec:
  instances: 1

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "128MB"
      effective_cache_size: "384MB"
      maintenance_work_mem: "64MB"
      checkpoint_completion_target: "0.9"
      wal_buffers: "16MB"
      default_statistics_target: "100"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      work_mem: "4MB"
      min_wal_size: "1GB"
      max_wal_size: "4GB"
      log_statement: "all"
      log_min_duration_statement: "1000"

  bootstrap:
    initdb:
      database: MailArchiver
      owner: mailuser
      encoding: UTF8
      localeCollate: en_US.UTF-8
      localeCType: en_US.UTF-8
      dataChecksums: true

  storage:
    size: 10Gi
    storageClass: longhorn

  # resources:
  #   requests:
  #     cpu: 200m
  #     memory: 512Mi
  #   limits:
  #     cpu: 1
  #     memory: 2Gi

  # monitoring:
  #   enabled: true
