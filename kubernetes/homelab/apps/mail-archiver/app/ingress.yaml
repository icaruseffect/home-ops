---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mail-archiver
  namespace: mail-archiver
  labels:
    app: mail-archiver
  annotations:
    cert-manager.io/cluster-issuer: ca-issuer                                                                                      │
    cert-manager.io/private-key-algorithm: ECDSA                                                                                   │
    cert-manager.io/private-key-size: 256                                                                                          │
    k8s-gateway.dns/hostname: mail-archiver.lab.lan
spec:
  ingressClassName: cilium
  tls:
    - hosts:
        - mail-archiver.${SECRET_DOMAIN}
      secretName: mail-archiver-tls
  rules:
    - host: mail-archiver.${SECRET_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mail-archiver
                port:
                  number: 5000
