---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-image-keeper
  namespace: kuik
spec:
  releaseName: kube-image-keeper
  chart:
    spec:
      chart: kube-image-keeper
      version: 2.3.1
      sourceRef:
        kind: HelmRepository
        name: enix-charts
        namespace: flux-system
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    manager:
      serviceMonitor:
        create: true
