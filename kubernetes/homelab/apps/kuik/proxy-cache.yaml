---
# Routes docker.io/ghcr.io/quay.io pulls through Harbor "Proxy Cache" projects
# instead of the upstream registry, once those projects exist on harbor.lab.lan
# (see kubernetes/homelab/apps/harbor). Harbor does the actual caching; kuik only
# rewrites the Pod image reference. priority: -1 makes kuik prefer the Harbor
# path, but it live-checks availability first and falls back to the original
# registry if Harbor (or the specific proxy project) is unreachable.
apiVersion: kuik.enix.io/v1alpha1
kind: ClusterReplicatedImageSet
metadata:
  name: dockerhub-proxy-cache
spec:
  priority: -1
  upstreams:
    - registry: docker.io
      path: /
      imageFilter:
        include:
          - .*
    - registry: harbor.lab.lan
      path: /proxy-docker.io/
      imageFilter:
        include:
          - /proxy-docker.io/.*
---
apiVersion: kuik.enix.io/v1alpha1
kind: ClusterReplicatedImageSet
metadata:
  name: ghcr-proxy-cache
spec:
  priority: -1
  upstreams:
    - registry: ghcr.io
      path: /
      imageFilter:
        include:
          - .*
    - registry: harbor.lab.lan
      path: /proxy-ghcr.io/
      imageFilter:
        include:
          - /proxy-ghcr.io/.*
---
apiVersion: kuik.enix.io/v1alpha1
kind: ClusterReplicatedImageSet
metadata:
  name: quay-proxy-cache
spec:
  priority: -1
  upstreams:
    - registry: quay.io
      path: /
      imageFilter:
        include:
          - .*
    - registry: harbor.lab.lan
      path: /proxy-quay.io/
      imageFilter:
        include:
          - /proxy-quay.io/.*
