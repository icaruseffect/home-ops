---
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: localai
  namespace: localai
spec:
  interval: 5m
  chart:
    spec:
      chart: ./charts/local-ai
      sourceRef:
        kind: GitRepository
        name: localai-source
        namespace: flux-system
      interval: 5m
  # chart:
  #   spec:
  #     chart: local-ai
  #     version: latest
  #     sourceRef:
  #       kind: HelmRepository
  #       name: localai-charts
  #       namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: localai-helm-values
