---
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: backup
  namespace: k8up-system
spec:
  resourceRequirementsTemplate:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
  podConfigRef:
    name: restic-tuning
  backend:
    repoPasswordSecretRef: { name: backup-repo, key: password }
    s3:
      endpoint: https://eu2.contabostorage.com
      bucket: backup-homelab/restic
      accessKeyIDSecretRef: { name: contabo-creds, key: username }
      secretAccessKeySecretRef: { name: contabo-creds, key: password }
  backup:
    schedule: "0 2 * * *"
  check:
    schedule: "0 4 * * 0"
  prune:
    schedule: "0 5 1 * *"
    resources:
      limits: { memory: 2Gi }
    retention:
      keepDaily: 14
      keepWeekly: 8
      keepMonthly: 12
