---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: surveillance
resources:
  - helmrepository.yaml
  - helmrelease.yaml
  - imagerepository.yaml
  - imagepolicy.yaml
  - imageupdateautomation.yaml
configMapGenerator:
  - name: frigate-values
    files:
      - values-simulation.yaml
generatorOptions:
  disableNameSuffixHash: true
