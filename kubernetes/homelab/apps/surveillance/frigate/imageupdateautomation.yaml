---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: frigate
  namespace: surveillance
spec:
  interval: 30m
  sourceRef:
    kind: GitRepository
    name: home-ops
    namespace: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
      messageTemplate: |
        chore: update frigate image to {{range .Updated.Images}}{{println .}}{{end}}
    push:
      branch: main
  update:
    path: ./kubernetes/homelab/apps/surveillance/frigate/ # dir containing values-simulation.yaml
    strategy: Setters
