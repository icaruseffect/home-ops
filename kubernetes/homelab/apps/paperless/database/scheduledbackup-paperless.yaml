---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: paperless-postgres-db-daily
  namespace: paperless
spec:
  # CNPG cron is 6-field (seconds first): 02:30 daily
  schedule: "0 30 2 * * *"
  backupOwnerReference: self
  immediate: true
  cluster:
    name: paperless-postgres-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
