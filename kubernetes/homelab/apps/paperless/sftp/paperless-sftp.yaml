---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-sftp
  namespace: paperless
  labels:
    app: paperless-sftp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperless-sftp
  template:
    metadata:
      labels:
        app: paperless-sftp
    spec:
      containers:
        - name: sftp
          image: atmoz/sftp:latest
          ports:
            - containerPort: 22
          command:
            [
              "/bin/bash",
              "-c",
              "cp -v /etc/ssh/hostkeys/* /etc/ssh/ && /entrypoint",
            ]
          volumeMounts:
            # - name: data
            #   mountPath: /home/paperless/upload
            - name: ssh-keys
              mountPath: /etc/ssh/hostkeys
              readOnly: true
            - mountPath: /home/sftp/consume
              name: data
              subPath: consume
            - mountPath: /home/sftp/.ssh/keys
              name: drucker-pubkey
          env:
            - name: SFTP_USERS
              value: "sftp::1000:1000:consume"
          securityContext:
            runAsUser: 0
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paperless-ngx-data-pvc
        - name: ssh-keys
          secret:
            secretName: sftp-keys
            defaultMode: 0600
        - name: drucker-pubkey
          secret:
            secretName: drucker-publickey
            defaultMode: 0600
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-sftp
  namespace: paperless
spec:
  type: NodePort
  ipFamilyPolicy: PreferDualStack
  ipFamilies:
    - IPv4
    - IPv6
  selector:
    app: paperless-sftp
  ports:
    - nodePort: 30022
      targetPort: 22
      port: 22
