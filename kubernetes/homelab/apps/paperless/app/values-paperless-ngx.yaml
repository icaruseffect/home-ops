---
# Helm values for adnoctem/paperless-ngx
#   repo:  https://adnoctem.github.io/helm   (formerly fmjstudios)
#   chart: paperless-ngx 0.3.1
#
# Consumed by the configMapGenerator in kustomization.yaml as
# ConfigMap/paperless-ngx-values, key values-paperless-ngx.yaml.
#
# Built from the upstream 0.3.1 defaults with local overrides merged in - do not
# trim unset keys. Several templates dereference values without an `if` guard,
# so a missing key renders an empty env var into the ConfigMap rather than being
# omitted (paperless.cron.* is the worst offender; see the note there).
# --- Image -----------------------------------------------------------------
# CORRECTED: 2.20.10 - taken from the running pod, NOT the chart's appVersion.
# The chart still declares appVersion 2.10.1, so leaving image.tag empty here
# would downgrade you ten minor versions across paperless's forward-only
# migration chain. Pin it, and drive it with Flux image automation
# ($imagepolicy marker) rather than by editing the StatefulSet by hand.
image:
  registry: ghcr.io
  repository: paperless-ngx/paperless-ngx
  tag: "2.20.10"
  digest: ""
  pullPolicy: IfNotPresent
  pullSecrets: []
nameOverride: ""
fullnameOverride: ""
paperless:
  domain: paperless.lab.lan
  appTitle: ""
  appLogo: ""
  # unchanged: existingSecret wins; `value` cleared so a stray edit can't turn
  # the literal string "paperless" into your Django SECRET_KEY
  secretKey:
    value: ""
    existingSecret:
      name: paperless
      key: PAPERLESS_SECRET_KEY
  address: 0.0.0.0
  port: 8000
  uid: 1000
  gid: 1000
  enableFlower: true
  webserverWorkers: 2
  taskWorkers: "2"
  threadsPerWorker: "2"
  workerTimeout: ""
  timeZone: Europe/Berlin
  enableNLTK: ""
  enableAuditLog: true
  enableCompression: "1"
  apps: allauth.socialaccount.providers.openid_connect
  maxImagePixels: ""
  emptyTrashDelay: ""
  auth:
    autoLoginUsername: ""
    adminUser: ""
    adminPassword: ""
    existingSecret: ""
    adminMail: ""
    allowSignups: ""
    disableRegularLogin: false
    sessionRemember: None
    defaultHTTPProtocol: https
    emailVerification: optional
    social:
      accountProviders: openid_connect
      existingSecret: paperless-auth
      allowSignups: true
      autoSignup: true
  # CHANGED: allowedHosts had paperless-ngx.paperless.svc.cluster.local twice
  hosting:
    trustedOrigins: https://paperless.lab.lan,http://paperless-ngx:8000,http://paperless-ngx.paperless.svc.cluster.local
    allowedHosts: paperless.lab.lan,paperless-ngx,paperless-ngx.paperless.svc.cluster.local
    corsAllowedHosts: ""
    trustedProxies: ""
    forceScriptName: ""
    staticURL: ""
    cookiePrefix: ""
    enableHTTPRemoteUser: false
    enableHTTPRemoteUserAPI: false
    HTTPRemoteUserHeaderName: ""
    logoutRedirectURL: ""
    useXForwardHost: true
    useXForwardPort: false
    proxySSLHeader: ""
  # DO NOT DELETE THIS BLOCK. The chart emits each cron env var only when the
  # value differs from a hardcoded sentinel, and it dereferences these keys
  # unguarded - removing them renders empty cron strings into the ConfigMap.
  # As set, every entry equals its sentinel (or paperless's own default), so
  # nothing is emitted except PAPERLESS_INDEX_TASK_CRON. Effectively inert.
  cron:
    emailTask: "*/10 * * * *"
    trainTask: 5 */1 * * *
    indexTask: 0 0 * * *
    sanityTask: 30 0 * *
    emptyTrashTask: 30 0 * *
  redis:
    host: ""
    port: 6379
    username: ""
    password: paperless
    existingSecret: ""
    prefix: ""
  # CHANGED: use the CNPG-managed secret instead of plaintext credentials.
  # The chart reads keys `username` and `password`; `paperless-db` is
  # type kubernetes.io/basic-auth, so it is drop-in compatible.
  # VERIFY BEFORE APPLYING (see notes) - a mismatch breaks DB auth.
  # Helm will delete the now-untemplated `paperless-ngx-postgresql-auth`.
  postgresql:
    host: paperless-postgres-db-rw
    port: 5432
    name: paperless
    user: ""
    password: ""
    existingSecret: paperless-db
    # DEPRECATED (PAPERLESS_DBSSLMODE): moved to extraEnvVars as
    # PAPERLESS_DB_OPTIONS "sslmode=prefer" - see bottom of this file.
    sslMode: ""
    timeout: ""
    certs:
      rootCert: ""
      cert: ""
      key: ""
  tika:
    enabled: true
    endpoint: ""
  gotenberg:
    endpoint: ""
  smtp:
    host: ""
    port: ""
    user: ""
    password: ""
    existingSecret: ""
    from: ""
    useTLS: false
    useSSL: false
  data:
    paths:
      consumptionDir: ""
      dataDir: ""
      trashDir: ""
      emptyTrashDir: ""
      mediaRoot: ""
      staticDir: ""
      filenameFormat: ""
      filenameFormatRemoveNone: false
      loggingDir: ""
      nltkDir: ""
      emailCertificateLocation: ""
      modelFile: ""
      supervisordWorkingDir: ""
    pvc:
      size: 10Gi
      storageClass: openebs-hostpath
      reclaimPolicy: Retain
      existingClaim: ""
  logging:
    logrotateMaxSize: ""
    logrotateMaxBackups: ""
  ocr:
    language: deu+eng
    additionalLanguages: eng
    # v3: `skip`/`skip_noarchive` were removed. `auto` + archiveFileGeneration
    # below reproduces the old `mode: skip` behavior (skip OCR when text is
    # present, always produce an archive) - see docs/migration-v3.md.
    mode: auto
    # v3 replacement for the removed `skipArchiveFile`. Old `never` ==
    # new `always` (always generate archive); `always` is also the chart
    # default, so this renders no env var.
    archiveFileGeneration: always
    deskew: true
    rotatePages: true
    rotatePagesThreshold: 12
    outputType: pdfa
    pages: ""
    imageDPI: ""
    maxImagePixels: ""
    colorConversionStrategy: ""
    userArgs: ""
  conversion:
    memoryLimit: ""
    tmpDir: ""
  consume:
    deleteDuplicates: true
    recursive: true
    subdirsAsTags: false
    ignorePatterns: ""
    preConsumeScript: ""
    # VERIFY: empty here means PAPERLESS_POST_CONSUME_SCRIPT is never emitted,
    # which would make the init container and scripts mount above inert. Check
    # what the live ConfigMap has:
    #   kubectl -n paperless get cm paperless-ngx-general -o jsonpath='{.data.PAPERLESS_POST_CONSUME_SCRIPT}'
    # If it is set there, put the same value here (most likely
    # /usr/src/paperless/scripts/post-consume.sh). Left empty deliberately so
    # this change cannot switch the hook on by surprise.
    postConsumeScript: ""
    filenameDateOrder: ""
    numberOfSuggestedDates: 3
    thumbnailFontName: ""
    ignoreDates: 17-08-1990,17.08.1990,1990-17-08
    dateOrder: ""
    polling:
      enabled: 0
      retryCount: 5
      delay: 5
    iNotify:
      delay: "0.5"
    barcodes:
      enabled: true
      tiffSupport: false
      string: PATCHT
      enableASNBarcode: "true"
      ASNBarcodePrefix: ASN
      upscale: "0.0"
      dpi: 300
      enableTagBarcode: false
      tagBarcodeMapping: ""
    collate:
      enableDoubleSided: false
      doubleSidedSubdirName: ""
      doubleSidedTiffSupport: false
  binaries:
    convert: ""
    gs: ""
configMap:
  annotations: {}
  labels: {}
secret:
  annotations: {}
  labels: {}
ingress:
  enabled: true
  className: cilium
  whitelist: ""
  annotations:
    cert-manager.io/cluster-issuer: ca-issuer
    cert-manager.io/private-key-algorithm: ECDSA
    cert-manager.io/private-key-size: "256"
  tls:
    - secretName: cert-tls-lab-lan-paperless
      hosts:
        - paperless.lab.lan
  extraHosts: []
# --- Service ---------------------------------------------------------------
# REMOVED: `ipFamilies` - the template only renders ipFamilyPolicy, the family
# list was silently dropped.
# EMPTIED: `ipFamilyPolicy` - svc.yaml line 54 uses `{{- if ... -}}`, whose
# trailing dash eats the newline before the field, gluing it onto `name: http`
# and producing "mapping values are not allowed in this context". Any truthy
# value breaks the render. Use a HelmRelease postRenderer if you need it.
# Pods are dual-stack (the live pod has an fd70:.../64 address) but the Service
# is single-stack v4, so paperless.address stays 0.0.0.0.
service:
  type: ClusterIP
  port: 8000
  nodePort: 30080
  extraPorts: []
  annotations: {}
  labels: {}
  externalTrafficPolicy: Cluster
  internalTrafficPolicy: Cluster
  clusterIP: ""
  loadBalancerIP: ""
  loadBalancerClass: ""
  loadBalancerSourceRanges: []
  externalIPs: []
  sessionAffinity: None
  sessionAffinityConfig: {}
  ipFamilyPolicy: ""
rbac:
  create: true
  rules: []
serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""
  secrets: []
livenessProbe:
  enabled: false
  initialDelaySeconds: 5
  timeoutSeconds: 1
  periodSeconds: 10
  successThreshold: 1
  failureThreshold: 10
# CHANGED: startup + readiness enabled. Both are httpGet / on the http port;
# paperless answers 302 -> login, which counts as success. startupProbe gives
# 10 min of headroom for migrations before readiness takes over. Liveness left
# off deliberately. If endpoints flap, set enabled: false and tell me.
readinessProbe:
  enabled: true
  initialDelaySeconds: 10
  timeoutSeconds: 5
  periodSeconds: 15
  successThreshold: 1
  failureThreshold: 6
startupProbe:
  enabled: true
  initialDelaySeconds: 30
  timeoutSeconds: 5
  periodSeconds: 10
  successThreshold: 1
  failureThreshold: 60
podDisruptionBudget:
  enabled: false
  minAvailable: 1
# CHANGED: requests added (paperless had none while tika had limits).
# Tune the memory limit if pdfa OCR of large scans gets OOMKilled.
resources:
  requests:
    cpu: 250m
    memory: 1536Mi
  limits:
    memory: 2560Mi
volumes:
  - name: scripts-dir
    emptyDir: {}
  # VERIFY: the live pod mounts ConfigMap `post-consume-script` (309d old, not
  # managed by your kustomization). Your configMapGenerator produces
  # `paperless-post-consume-script` from post-consume.sh in the repo. Pointing at
  # the repo-managed one resolves the drift, but confirm the contents match:
  #   diff <(kubectl -n paperless get cm post-consume-script -o jsonpath='{.data.post-consume\.sh}') \
  #        <(kubectl -n paperless get cm paperless-post-consume-script -o jsonpath='{.data.post-consume\.sh}')
  # If they differ, change this to `post-consume-script` to preserve current
  # behaviour, then reconcile the script in git separately.
  - name: post-consume-script
    configMap:
      name: paperless-post-consume-script
# RESTORED: the running pod mounts scripts-dir at /usr/src/paperless/scripts and
# runs the setup-script init container. Both were commented out in the git
# values, so rendering from that file would have silently removed them.
# CHANGED: added the export subPath. The chart only mounts data/ and media/;
# /usr/src/paperless/export was on the container overlay, so document_exporter
# output was being discarded on restart.
volumeMounts:
  - name: paperless-ngx-data-pv
    mountPath: /usr/src/paperless/consume
    subPath: consume
  - name: paperless-ngx-data-pv
    mountPath: /usr/src/paperless/export
    subPath: export
  - name: scripts-dir
    mountPath: /usr/src/paperless/scripts
initContainers:
  - name: setup-script
    # `busybox` untagged resolves to :latest - pin a digest or tag when you get
    # the chance, this is an unversioned dependency in your critical path.
    image: busybox
    command:
      - sh
      - -c
      - |
        cp /configmap/post-consume.sh /scripts/post-consume.sh
        chmod 755 /scripts/post-consume.sh
        chown 1000:1000 /scripts/post-consume.sh
    volumeMounts:
      - name: post-consume-script
        mountPath: /configmap
      - name: scripts-dir
        mountPath: /scripts
nodeSelector: {}
tolerations: []
affinity: {}
strategy: {}
# --- extraEnvVars (chart >=0.4.0) -------------------------------------------
# v3 allauth changed client-IP detection for login rate limiting; behind the
# Cilium ingress (1 proxy hop) logins can 403 unless the proxy is trusted.
# See docs/migration-v3.md "Reverse Proxy and Login Rate Limiting".
extraEnvVars:
  - name: PAPERLESS_ALLAUTH_TRUSTED_PROXY_COUNT
    value: "1"
  # sslmode moved here from the deprecated PAPERLESS_DBSSLMODE. CNPG has TLS
  # pinned to TLSv1.3, so keep `prefer` semantics via PAPERLESS_DB_OPTIONS.
  - name: PAPERLESS_DB_OPTIONS
    value: sslmode=prefer
podAnnotations: {}
podLabels: {}
priorityClassName: ""
podSecurityContext: {}
securityContext: {}
# --- PostgreSQL subchart (disabled - CNPG handles this) ---------------------
# CHANGED: credentials blanked. Block is inert while enabled: false, but the
# plaintext defaults had no business sitting in a ConfigMap in git.
postgresql:
  global:
    imageRegistry: docker.io
    security:
      allowInsecureImages: false
  image:
    registry: docker.io
    repository: bitnamisecure/postgresql
    tag: latest
  enabled: false
  auth:
    enablePostgresUser: false
    postgresPassword: ""
    username: ""
    password: ""
    database: ""
    usePasswordFiles: false
  primary:
    name: primary
    persistence:
      enabled: true
      existingClaim: ""
      storageClass: ""
      accessModes:
        - ReadWriteOnce
      size: 5Gi
# --- Redis (Bitnami subchart) ----------------------------------------------
# NEW IN 0.3.x: the image block below is the chart's answer to Bitnami's BSI
# migration. Your current pods reference docker.io/bitnami/redis:<pinned>,
# which no longer exists on Docker Hub - it only survives in your node's image
# cache and would fail to pull on any node rebuild.
#
# `bitnamisecure/redis:latest` is unpinned and a newer Redis major than the
# 7.x that wrote redis-data-paperless-ngx-redis-master-0. If the redis pod
# fails to start after this rollout, swap in the frozen legacy image:
#
#   global:
#     security:
#       allowInsecureImages: true
#   image:
#     registry: docker.io
#     repository: bitnamilegacy/redis
#     tag: "<tag currently running>"
#
# The real fix is dropping Bitnami here entirely - the broker holds nothing
# worth keeping.
redis:
  global:
    imageRegistry: docker.io
    security:
      allowInsecureImages: false
  image:
    registry: docker.io
    repository: bitnamisecure/redis
    tag: latest
  enabled: true
  architecture: standalone
  auth:
    password: paperless
# --- Tika / Gotenberg subcharts --------------------------------------------
tika:
  enabled: true
  replicaCount: 1
  resources:
    limits:
      cpu: 2
      memory: 2000Mi
    requests:
      cpu: 50m
      memory: 100Mi
gotenberg:
  enabled: true
  gotenberg:
    chromium:
      disableJavaScript: false
      allowList: file:///tmp/.*
    logging:
      level: warn
