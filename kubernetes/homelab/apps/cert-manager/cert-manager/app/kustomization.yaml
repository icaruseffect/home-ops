# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cert-manager
resources:
  - helm-release.yaml
configMapGenerator:
  - name: cert-manager-values
    files:
      - values.yaml
    options:
      disableNameSuffixHash: true
