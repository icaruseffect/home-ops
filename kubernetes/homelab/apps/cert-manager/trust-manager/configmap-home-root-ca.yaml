  # signing cert in the ca-key-pair secret used by the ca-issuer
  # ClusterIssuer). ca-key-pair only carries the intermediate, so without
  # this the home-ca.lan trust bundle can't build a full chain and TLS
  # clients see "unable to get issuer certificate" against mosquitto and
  # other ca-issuer-signed services.
