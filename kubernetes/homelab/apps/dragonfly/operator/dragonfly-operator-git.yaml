---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/gitrepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: dragonfly-operator
  namespace: flux-system
spec:
  # dragonflydb/dragonfly-operator does not publish its Helm chart to a working
  # HelmRepository index or OCI registry (the gh-pages branch is empty and the
  # custom domain 404s) - the chart only exists in-tree, so it has to be
  # consumed straight from the git source. Same approach already running on
  # talos-flux.
  interval: 1h
  url: https://github.com/dragonflydb/dragonfly-operator.git
  ref:
    tag: v1.6.1
  ignore: |
    /*
    !/charts/dragonfly-operator
