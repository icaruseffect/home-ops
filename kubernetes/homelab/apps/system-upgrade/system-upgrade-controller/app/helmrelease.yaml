---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app system-upgrade-controller
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.x.x
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      system-upgrade-controller:
        strategy: RollingUpdate
        replicas: 1
        containers:
          app:
            image:
              repository: docker.io/rancher/system-upgrade-controller
              tag: v0.15.2@sha256:3e899833afcea9a8788d384ce976df9a05be84636fe5c01ec2307b5bd8fe9810
            env:
              SYSTEM_UPGRADE_CONTROLLER_LEADER_ELECT: true
              SYSTEM_UPGRADE_CONTROLLER_NAME: *app
              SYSTEM_UPGRADE_CONTROLLER_NAMESPACE:
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              SYSTEM_UPGRADE_CONTROLLER_NODE_NAME:
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
              SYSTEM_UPGRADE_JOB_BACKOFF_LIMIT: "99"
              # Upgrade jobs nsenter into the host's mount namespace
              # (see plans/archlinux.yaml) which requires a privileged pod.
              SYSTEM_UPGRADE_JOB_PRIVILEGED: true
              # Default (900s, and apparently 600s on this controller
              # version) is not enough headroom: a routine full pacman -Su
              # on this box took ~11 minutes even under only moderate load.
              # Getting SIGTERM'd mid-transaction is far worse than running
              # long -- it killed the job before pacman's post-transaction
              # hooks (mkinitcpio, bootloader/UKI regeneration) ever ran,
              # leaving a kernel installed with no bootable entry for it
              # and requiring physical recovery. Give it a lot of slack.
              SYSTEM_UPGRADE_JOB_ACTIVE_DEADLINE_SECONDS: "3600"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
    serviceAccount:
      name: system-upgrade
