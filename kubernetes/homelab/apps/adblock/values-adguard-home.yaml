---
# Default values for adguard-home.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Choose deployment type: Deployment or StatefulSet
deploymentType: Deployment

replicaCount: 1

image:
  repository: adguard/adguardhome
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# service:
#   type: ClusterIP
#   port: 80

services:
  http:
    type: ClusterIP
    # -- Service annotations
    annotations: {}
    # -- Internal cluster service IP for HTTP (when applicable)
    clusterIP: ""
    # -- Set traffic policy for external traffic. Set to "Local" to preserve client ip address in case of service type "LoadBalancer" or "NodePort"
    externalTrafficPolicy:
    # -- Load balancer IP for HTTP (when applicable)
    loadBalancerIP:
    # -- (int) Node port for HTTP (when applicable)
    port: 80
    nodePort:
    # -- Dual-stack policy for HTTP
    ipFamilyPolicy: PreferDualStack
    # -- Dual-stack families for HTTP, for dual-stack parameters see official kubernetes [dual-stack concept documentation](https://kubernetes.io/docs/concepts/services-networking/dual-stack/).
    ipFamilies:
      - IPv4
      - IPv6
  https:
    enabled: false
    type: ClusterIP
    # -- Service annotations
    annotations: {}
    # -- Internal cluster service IP for HTTPS (when applicable)
    clusterIP: ""
    # -- Set traffic policy for external traffic. Set to "Local" to preserve client ip address in case of service type "LoadBalancer" or "NodePort"
    externalTrafficPolicy:
    # -- Load balancer IP for HTTPS (when applicable)
    loadBalancerIP:
    # -- (int) Node port for HTTPS (when applicable)
    nodePort:
    port: 443
    # -- Dual-stack policy for HTTPS
    ipFamilyPolicy: PreferDualStack
    # -- Dual-stack families for HTTPS; for dual-stack parameters see official kubernetes [dual-stack concept documentation](https://kubernetes.io/docs/concepts/services-networking/dual-stack/).
    ipFamilies:
      - IPv4
      - IPv6
  dns:
    enabled: true
    type: NodePort
    # -- Service annotations
    annotations: {}
    # -- Internal cluster service IP for DNS (when applicable)
    clusterIP: ""
    # -- Set traffic policy for external traffic. Set to "Local" to preserve client ip address in case of service type "LoadBalancer" or "NodePort"
    externalTrafficPolicy: Local
    # -- Load balancer IP for DNS (when applicable)
    loadBalancerIP:
    tcp:
      port: 53
      nodePort: 30053
    udp:
      port: 53
      nodePort: 30053
    # -- Dual-stack policy for DNS
    ipFamilyPolicy: PreferDualStack
    # -- Dual-stack families for DNS; for dual-stack parameters see official kubernetes [dual-stack concept documentation](https://kubernetes.io/docs/concepts/services-networking/dual-stack/).
    ipFamilies:
      - IPv4
  dnsOverTls:
    enabled: true
    type: NodePort
    # -- Service annotations
    annotations: {}
    # -- Internal cluster service IP for DNS over TLS (when applicable)
    clusterIP: ""
    # -- Set traffic policy for external traffic. Set to "Local" to preserve client ip address in case of service type "LoadBalancer" or "NodePort"
    externalTrafficPolicy:
    # -- Load balancer IP for DNS over TLS (when applicable)
    loadBalancerIP:
    # -- (int) Node port for DNS over TLS (when applicable)
    port: 853
    nodePort: 30853
    # -- Dual-stack policy for DNS over TLS
    ipFamilyPolicy: PreferDualStack
    # -- Dual-stack families for DNS over TLS; for dual-stack parameters see official kubernetes [dual-stack concept documentation](https://kubernetes.io/docs/concepts/services-networking/dual-stack/).
    ipFamilies:
      - IPv4
  dnsOverQuic:
    enabled: true
    type: NodePort
    # -- Service annotations
    annotations: {}
    port1:
      port: 784
      nodePort: 30784
    port2:
      port: 8853
      nodePort: 31853
    # -- Internal cluster service IP for DNS Over QUIC (when applicable)
    clusterIP: ""
    # -- Set traffic policy for external traffic. Set to "Local" to preserve client ip address in case of service type "LoadBalancer" or "NodePort"
    externalTrafficPolicy:
    # -- Load balancer IP for DNS Over QUIC (when applicable)
    loadBalancerIP:
    # -- Dual-stack policy for DNS Over QUIC
    ipFamilyPolicy: PreferDualStack
    # -- Dual-stack families for DNS Over QUIC; for dual-stack parameters see official kubernetes [dual-stack concept documentation](https://kubernetes.io/docs/concepts/services-networking/dual-stack/).
    ipFamilies:
      - IPv4
  dnscrypt:
    enabled: true
    type: NodePort
    # -- Service annotations
    annotations: {}
    # -- Internal cluster service IP for DNSCrypt (when applicable)
    clusterIP: ""
    # -- Set traffic policy for external traffic. Set to "Local" to preserve client ip address in case of service type "LoadBalancer" or "NodePort"
    externalTrafficPolicy:
    # -- Load balancer IP for DNSCrypt (when applicable)
    loadBalancerIP:
    tcp:
      port: 5443
      nodePort: 31443
    udp:
      port: 5443
      nodePort: 31443
    # -- Dual-stack policy for DNSCrypt
    ipFamilyPolicy: PreferDualStack
    # -- Dual-stack families for DNSCrypt; for dual-stack parameters see official kubernetes [dual-stack concept documentation](https://kubernetes.io/docs/concepts/services-networking/dual-stack/).
    ipFamilies:
      - IPv4

# -- Additional services
extraServices:
  - name: "dns-loadbalancer"
    annotations:
      lbipam.cilium.io/ips: "192.168.8.20,fd1f:5691:b710:8::20"
      service.kubernetes.io/healthcheck-nodeport: "32139"
    labels:
      homelab/public-service: "true"
    spec:
      type: LoadBalancer
      externalTrafficPolicy: Local
      internalTrafficPolicy: Cluster
      healthCheckNodePort: 32139
      ipFamilyPolicy: PreferDualStack
      ipFamilies:
        - IPv4
        - IPv6
      ports:
        - name: dns-tcp
          port: 53
          protocol: TCP
          targetPort: dns-tcp
        - name: dns-udp
          port: 53
          protocol: UDP
          targetPort: dns-udp

ingresses:
  http:
    enabled: true
    className: cilium
    annotations:
      cert-manager.io/cluster-issuer: ca-issuer
      k8s-gateway.dns/hostname: adguard.lab.lan
    hosts:
      - host: adguard.lab.lan
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: adguard.lab.lan-tls
        hosts:
          - adguard.lab.lan
  https:
    enabled: false
    className: ""
    annotations:
      cert-manager.io/cluster-issuer: ca-issuer
      k8s-gateway.dns/hostname: adguard.lab.lan
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
    hosts:
      - host: adguard.lab.lan
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: adguard.lab.lan-tls
        hosts:
          - adguard.lab.lan

httproutes:
  http:
    enabled: false
    annotations: {}
    parentRefs: []
    hostnames: []
    # - adguard-home-example.local
    rules: []
    # - matches:
    #   - path:
    #       type: PathPrefix
    #       value: /
    #   backendRefs:
    #   - name: adguard-home-http
    #     port: 80
  https:
    enabled: false
    annotations: {}
    parentRefs: []
    hostnames: []
    # - adguard-home-example.local
    rules: []
    # - matches:
    #   - path:
    #       type: PathPrefix
    #       value: /
    #   backendRefs:
    #   - name: adguard-home-https
    #     port: 443

resources:
  requests:
    memory: 384Mi
  limits:
    memory: 768Mi
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# -- Strategy used to replace old Pods by new ones
strategy: {}
  # type: RollingUpdate
  # rollingUpdate:
  #   maxSurge: 1
  #   maxUnavailable: 33%

# -- Host networking requested for the pod. Beware that setting this to true requires all container ports declared in the pod to be free on the node. This can be useful for example to expose AdGuard Home as a DHCP Server.
hostNetwork: false

priorityClassName: ""
livenessProbe: null
readinessProbe: null
startupProbe: null

persistence:
  # -- Disabling this will mount the container with an emptyDir
  enabled: true
  existingClaim: null
  volumeClaimSpec:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 1Gi
    # storageClassName: "" # Optional: specify storage class
  # Use when deploymentType is StatefulSet
  volumeClaimTemplates:
    enabled: true # Set to true to use volumeClaimTemplates, false to use existing PVC
  emptyDir:
    sizeLimit: 1Gi

backup:
  # -- Note that this depends on the Access Mode set for the persistent volume claim (PVC) specified.
  # -- As a consequence, backups will not be possible if the PVC access mode is set to ReadWriteOncePod (Kubernetes 1.22+),
  # -- since the volume will be accessible only to the sole Adguard Home pod.
  enabled: false
  # -- How frequently the Backup job should run. Cron Syntax, as supported by Kubernetes CronJobs
  schedule: "@daily"
  concurrencyPolicy: Forbid
  restartPolicy: OnFailure
  ttlSecondsAfterFinished: 300
  activeDeadlineSeconds: 1800
  backoffLimit: 1
  parallelism: 1
  imagePullPolicy: IfNotPresent
  resources: {}
  aws:
    # -- For now, only AWS is supported. Setting this to `false` (while `backup.enabled` is `true`) will cause a deployment error.
    enabled: true
    # -- AWS Access Key. Must have the permissions to write to the target bucket.
    accessKeyId: "my-aws-access-key-id"
    # -- AWS Secret Key. Must have the permissions to write to the target bucket.
    secretKey: "my-aws-secret-key"
    # -- Target destination bucket (absolute) in AWS S3, where the backup resources should be written
    s3:
      destination: "s3://path/to/my/adguard-home-backup-bucket"

# -- Whether to enable bootstrapping the AdguardHome config file using the content in bootstrapConfig
bootstrapEnabled: true
# -- Use a provided secret with the Adguard config. Make sure it contains the field "AdGuardHome.yaml"
bootstrapExistingSecret: ""
bootstrapConfig:
  # -- AdGuard Home config. See [this page](https://github.com/AdguardTeam/AdGuardHome/wiki/Configuration#configuration-file)
  bind_host: 0.0.0.0
  bind_port: 80
  beta_bind_port: 0
  users: []
  # - name: admin
  #   # -- password encoded via httpasswd : r3allyPl34s3Ch4ng3M3
  #   password: $2y$05$0mz52NwW/bheVxROVUIVQ.Gf1HOyBP/SPK5DRmN/B0y.GNBN80xXO
  auth_attempts: 5
  block_auth_min: 15
  http_proxy: ""
  language: en
  debug_pprof: false
  web_session_ttl: 720
  dns:
    bind_hosts:
      - 0.0.0.0
    port: 53
    statistics_interval: 90
    querylog_enabled: true
    querylog_file_enabled: true
    querylog_interval: 168h
    querylog_size_memory: 1000
    anonymize_client_ip: false
    protection_enabled: true
    blocking_mode: default
    blocking_ipv4: ""
    blocking_ipv6: ""
    blocked_response_ttl: 10
    parental_block_host: family-block.dns.adguard.com
    safebrowsing_block_host: standard-block.dns.adguard.com
    ratelimit: 20
    ratelimit_whitelist: []
    refuse_any: true
    upstream_dns:
      - tcp://192.168.8.1
      - https://dns10.quad9.net/dns-query
      - https://dns.cloudflare.com/dns-query
      - tls://1dot1dot1dot1.cloudflare-dns.com
    upstream_dns_file: ""
    bootstrap_dns:
      - 192.168.8.1
      - 9.9.9.10
      - 149.112.112.10
      - 2620:fe::10
      - 2620:fe::fe:10
    all_servers: true
    fastest_addr: false
    fastest_timeout: 1s
    allowed_clients: []
    disallowed_clients: []
    blocked_hosts:
      - version.bind
      - id.server
      - hostname.bind
    trusted_proxies:
      - 127.0.0.0/8
      - ::1/128
      - 10.0.0.0/8
    cache_size: 4194304
    cache_ttl_min: 0
    cache_ttl_max: 0
    cache_optimistic: true
    bogus_nxdomain: []
    aaaa_disabled: false
    enable_dnssec: false
    edns_client_subnet: false
    max_goroutines: 300
    ipset: []
    filtering_enabled: true
    filters_update_interval: 24
    parental_enabled: false
    safesearch_enabled: false
    safebrowsing_enabled: false
    safebrowsing_cache_size: 1048576
    safesearch_cache_size: 1048576
    parental_cache_size: 1048576
    cache_time: 30
    rewrites: []
    blocked_services:
      - ids:
          - instagram
          - tiktok
    upstream_timeout: 10s
    local_domain_name: lan
    resolve_clients: true
    use_private_ptr_resolvers: true
    local_ptr_upstreams: []
  tls:
    enabled: false
    server_name: my.dns.example.com
    force_https: false
    port_https: 443
    port_dns_over_tls: 853
    port_dns_over_quic: 784
    port_dnscrypt: 0
    dnscrypt_config_file: ""
    # -- Whether to expose DNS over HTTPS over HTTP instead.
    # -- Useful if Adguard Home is behind a reverse proxy already terminating TLS connections.
    allow_unencrypted_doh: true
    strict_sni_check: false
    certificate_path: ""
    private_key_path: ""
  filters:
    - enabled: true
      url: https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt
      name: AdGuard DNS filter
      id: 1
    - enabled: false
      url: https://adaway.org/hosts.txt
      name: AdAway Default Blocklist
      id: 2
    - enabled: false
      url: https://raw.githubusercontent.com/crazy-max/WindowsSpyBlocker/master/data/hosts/spy.txt
      name: WindowsSpyBlocker - Hosts spy rules
      id: 1641249001
    - enabled: false
      url: https://abp.oisd.nl/basic/
      name: OISD Blocklist Basic
      id: 1641249002
    - enabled: false
      url: https://raw.githubusercontent.com/Perflyst/PiHoleBlocklist/master/SmartTV-AGH.txt
      name: Perflyst and Dandelion Sprout's Smart-TV Blocklist
      id: 1641249003
    - enabled: false
      url: https://raw.githubusercontent.com/DandelionSprout/adfilt/master/GameConsoleAdblockList.txt
      name: Game Console Adblock List
      id: 1641249004
  whitelist_filters: []
  user_rules: []
  dhcp:
    enabled: false
    interface_name: ""
    dhcpv4:
      gateway_ip: ""
      subnet_mask: ""
      range_start: ""
      range_end: ""
      lease_duration: 86400
      icmp_timeout_msec: 1000
      options: []
    dhcpv6:
      range_start: ""
      lease_duration: 86400
      ra_slaac_only: false
      ra_allow_slaac: false
  clients: []
  log_compress: false
  log_localtime: false
  log_max_backups: 0
  log_max_size: 100
  log_max_age: 3
  log_file: ""
  verbose: false
  os:
    group: ""
    user: ""
    rlimit_nofile: 0
  schema_version: 12

# -- Whether to add default volume mounts.
defaultVolumeMountsEnabled: true

# -- Additional Volume mounts
extraVolumeMounts: []

# -- Additional volumes
extraVolumes: []
