---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: music-assistant
  namespace: music
spec:
  interval: 30m
  chart:
    spec:
      chart: music-assistant
      sourceRef:
        kind: HelmRepository
        name: andibraeu
        namespace: flux-system
      version: "*"
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    service:
      stream:
        type: LoadBalancer
        ipFamilyPolicy: PreferDualStack
        ipFamilies:
          - IPv4
          - IPv6
        annotations:
          lbipam.cilium.io/ips: "192.168.8.19"
        ports:
          stream:
            port: 8095
            protocol: TCP
      web:
        type: LoadBalancer
        ipFamilyPolicy: PreferDualStack
        ipFamilies:
          - IPv4
          - IPv6
        annotations:
          lbipam.cilium.io/ips: "192.168.8.19"
        ports:
          web:
            port: 8095
            protocol: TCP
      slimproto-tcp:
        type: NodePort
        ipFamilyPolicy: PreferDualStack
        ipFamilies:
          - IPv4
          - IPv6
        ports:
          slimproto:
            port: 3483
            nodePort: 30931
            protocol: TCP
      slimproto-udp:
        type: NodePort
        ipFamilyPolicy: PreferDualStack
        ipFamilies:
          - IPv4
          - IPv6
        ports:
          slimproto:
            port: 3483
            nodePort: 31530
            protocol: UDP
