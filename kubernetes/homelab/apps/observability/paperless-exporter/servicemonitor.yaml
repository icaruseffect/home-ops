---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: paperless-exporter
  namespace: observability
  labels:
    app.kubernetes.io/name: paperless-exporter
    app.kubernetes.io/part-of: paperless
    # Add any required labels for your Prometheus to pick up this ServiceMonitor
    # For example, if using kube-prometheus-stack:
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless-exporter
  endpoints:
    - port: metrics
      interval: 60s
      path: /metrics
      scrapeTimeout: 30s
  namespaceSelector:
    matchNames:
      - observability
