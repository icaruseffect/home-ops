---
apiVersion: v1
kind: ConfigMap
metadata:
  name: paperless-exporter-config
  namespace: observability
  labels:
    app.kubernetes.io/name: paperless-exporter
    app.kubernetes.io/part-of: paperless
data:
  PAPERLESS_URL: http://paperless-ngx.paperless.svc.cluster.local:8000
  PAPERLESS_AUTH_TOKEN_FILE: /etc/exporter/auth-token.txt
  PAPERLESS_SERVER_TIMEZONE: Europe/Berlin
