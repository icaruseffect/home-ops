---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-exporter
  namespace: observability
  labels:
    app.kubernetes.io/name: paperless-exporter
    app.kubernetes.io/part-of: paperless
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperless-exporter
        app.kubernetes.io/part-of: paperless
    spec:
      containers:
        - name: exporter
          image: ghcr.io/hansmi/prometheus-paperless-exporter:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: paperless-exporter-config
                optional: false
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /etc/exporter
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
      volumes:
        - name: config
          secret:
            secretName: paperless-exporter-auth
            optional: false
      securityContext:
        fsGroup: 1000
