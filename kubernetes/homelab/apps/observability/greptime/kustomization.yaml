---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - helmrepository.yaml
  - helmrelease.yaml
configMapGenerator:
  - name: greptimedb-values
    files:
      - values-greptimedb.yaml
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
