---
apiVersion: v1
kind: Service
metadata:
  name: alloy-router-syslog
  namespace: observability
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: alloy
spec:
  # ClusterIP only: the router talks to crowdsec's syslog-relay (which fans
  # out to this Service), never to Alloy directly - no NodePort needed.
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: alloy
    app.kubernetes.io/name: alloy
  ports:
    - name: router-syslog
      protocol: UDP
      port: 1514
      targetPort: 1514
