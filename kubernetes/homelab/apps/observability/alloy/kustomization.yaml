---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability

resources:
  - helmrelease.yaml
  - svc-tcpsyslog.yaml
  - svc-router-syslog.yaml

configMapGenerator:
  - name: alloy-values
    files:
      - values-alloy.yaml
  - name: alloy-config
    files:
      - config.alloy

generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
