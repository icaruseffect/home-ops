---
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: weekly
  namespace: velero
spec:
  schedule: 0 1 * * 0
  skipImmediately: false
  template:
    csiSnapshotTimeout: 0s
    defaultVolumesToFsBackup: true
    hooks: {}
    includedNamespaces:
      - "*"
    itemOperationTimeout: 0s
    metadata: {}
    ttl: 720h0m0s
  useOwnerReferencesInBackup: false
