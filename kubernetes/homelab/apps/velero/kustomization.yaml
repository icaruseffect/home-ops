---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - vmware-tanzu-charts.yaml
  - backupstoragelocation-default.yaml
  - secret-cloud-credentials.yaml
  - helmrelease.yaml
  # - snapshotclass-openebs-local.yaml
  - secret-velero-repo-credentials.yaml
  - schedule-daily.yaml
  - schedule-weekly.yaml
  - schedule-monthly.yaml
  - schedule-quarterly.yaml
  - change-storage-class-config.yaml

configMapGenerator:
  - files:
      - velero-values.yaml
    name: helm-values
    namespace: velero
    options:
      disableNameSuffixHash: true
