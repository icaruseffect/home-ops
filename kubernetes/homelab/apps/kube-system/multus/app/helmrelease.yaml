---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: multus
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: rke2-multus
      version: v4.0.x
      sourceRef:
        kind: HelmRepository
        name: multus-cni
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    cni:
      confDir: /etc/cni/net.d
      binDir: /opt/cni/bin
