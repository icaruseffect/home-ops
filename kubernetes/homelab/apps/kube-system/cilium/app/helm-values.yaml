---
rollOutCiliumPods: true

# cilium-agent was previously unbounded (BestEffort QoS) on this single,
# memory-overcommitted node, making it the kernel OOM-killer's first target
# under any memory pressure - killing it drops the node's CNI and cascades
# into network blips for every pod on the node. Same fix, same reasoning as
# talos-flux (kubernetes/talos-flux/apps/kube-system/cilium/app/values.yaml).
resources:
  requests:
    cpu: 100m
    memory: 448Mi
  limits:
    cpu: 1000m
    memory: 1Gi

cni:
  exclusive: false

ipv6:
  enabled: true
cluster:
  name: homelab
# wg0 (infra/terraform/homelab-wireguard) so NodePorts answer on the WireGuard
# link to talos-flux. Changing this restarts the agent; see the incident note in
# kubernetes/talos-flux/apps/homeassistant/README.md before editing.
devices:
  - enp0s25
  - wg0
encryption:
  enabled: true
  type: wireguard
  wireguard:
    userspaceFallback: true
hubble:
  metrics:
    enabled:
      - dns:query;ignoreAAAA
      - drop
      - tcp
      - flow
      - icmp
      - http
  relay:
    enabled: true
    rollOutPods: true
    prometheus:
      serviceMonitor:
        enabled: true
  tls:
    enabled: true
    auto:
      enabled: true
      method: certmanager
      certManagerIssuerRef:
        group: cert-manager.io
        kind: ClusterIssuer
        name: ca-issuer
  ui:
    enabled: true
    ingress:
      annotations:
        cert-manager.io/cluster-issuer: ca-issuer
        cert-manager.io/private-key-algorithm: ECDSA
        cert-manager.io/private-key-size: "256"
      className: cilium
      enabled: true
      hosts:
        - hubble.lab.lan
      labels: {}
      tls:
        - hosts:
            - hubble.lab.lan
          secretName: hubble.lab.lan-tls
    rollOutPods: true
ingressController:
  enabled: true
  loadbalancerMode: shared
  service:
    labels:
      homelab/public-service: "true"
    ports:
      - name: http
        port: 80
        protocol: TCP
        targetPort: 80
      - name: https
        port: 443
        protocol: TCP
        targetPort: 443
    type: LoadBalancer
ipam:
  operator:
    clusterPoolIPv4PodCIDRList: 10.0.0.0/8
    clusterPoolIPv4MaskSize: 24
    clusterPoolIPv6PodCIDRList:
      - fd70:cf5e:a47b:1::/80
    clusterPoolIPv6MaskSize: 96
k8sServiceHost: 192.168.8.8
k8sServicePort: 6443
kubeProxyReplacement: true
l2NeighDiscovery:
  enabled: true
l2announcements:
  enabled: true
operator:
  resources:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 192Mi
  prometheus:
    serviceMonitor:
      enabled: true
      labels:
        release: prometheus-stack
  replicas: 1
  rollOutPods: true

# envoy is deployed by default in this chart version (cilium-envoy DaemonSet
# already live) even without this key present - adding only the same
# unbounded-QoS fix, not changing its enablement.
envoy:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
