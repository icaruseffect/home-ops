---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
  namespace: kube-system
spec:
  releaseName: k8s-gateway
  chart:
    spec:
      chart: k8s-gateway
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: k8s-gateway-charts
        namespace: flux-system
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # ori-edge/k8s_gateway (the previous image, quay.io/oriedge/k8s_gateway)
    # is unmaintained and its quay.io repo now requires auth (401 on every
    # pull, including from Harbor's proxy cache). This is the maintained
    # fork - image published on ghcr.io too (not just codeberg.org, which
    # isn't one of the mirrored registries), so it still benefits from the
    # Harbor proxy-ghcr pull-through cache. Pinned one patch behind (1.8.3
    # exists upstream) because ghcr.io only has up to 1.8.2 published so far.
    image:
      registry: ghcr.io
      tag: "1.8.2"

    # Same delegated zone as the previous deployment's Corefile
    # (`k8s_gateway lab.lan { apex lab.lan; ttl 300; resources Ingress }`).
    domain: lab.lan
    apex: lab.lan
    ttl: 300

    # Adds HTTPRoute on top of the previous Ingress-only config: homelab
    # migrated Cilium from Ingress to Gateway API, and the old ori-edge
    # image predates Gateway API support entirely, so HTTPRoute-only
    # services were never getting *.lab.lan DNS records.
    watchedResources:
      - Ingress
      - HTTPRoute

    service:
      type: LoadBalancer
      port: 53
      annotations:
        # Same static VIP the previous Service held (Cilium LB-IPAM), so
        # nothing depending on this IP (e.g. AdGuard Home's lab.lan
        # forwarder) needs to change.
        lbipam.cilium.io/ips: "192.168.8.18,fd1f:5691:b710:8::18"
      labels:
        homelab/public-service: "true"
      ipFamilyPolicy: PreferDualStack
      ipFamilies:
        - IPv4
        - IPv6
