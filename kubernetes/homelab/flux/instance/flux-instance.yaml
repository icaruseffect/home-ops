---
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  distribution:
    version: "2.x.x"
    registry: ghcr.io/fluxcd
    artifact: oci://ghcr.io/controlplaneio-fluxcd/flux-operator-manifests
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
    - image-reflector-controller
    - image-automation-controller
  cluster:
    type: kubernetes
  storage:
    class: openebs-hostpath
    size: 10Gi
  kustomize:
    patches:
      # kustomize-controller and notification-controller are deliberately scaled to 0/0 on
      # this cluster: manual `kubectl apply`/`sops -d | kubectl apply` is the required
      # workflow for plain manifests here (see CLAUDE.md - "Flux is not auto-reconciling").
      # Without this patch, flux-operator reconciles the FluxInstance's desired component
      # state and restores both to their normal replica count on every reconcile.
      - patch: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: not-used
          spec:
            replicas: 0
        target:
          kind: Deployment
          name: (kustomize-controller|notification-controller)
      # prevent deletion of namespace by flux
      - patch: |
          - op: add
            path: /metadata/labels/kustomize.toolkit.fluxcd.io~1prune
            value: disabled
        target:
          kind: Namespace
          version: v1
          name: flux-system
      # Increase the number of reconciliations that can be performed in parallel and bump the resources limits
      # https://fluxcd.io/flux/cheatsheets/bootstrap/#increase-the-number-of-workers
      - patch: |
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --concurrent=20
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --kube-api-qps=500
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --kube-api-burst=1000
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --requeue-dependency=5s
        target:
          kind: Deployment
          name: (kustomize-controller|helm-controller|source-controller)
      # increase resource limits for the controllers
      - patch: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: not-used
          spec:
            template:
              spec:
                containers:
                  - name: manager
                    resources:
                      requests:
                        memory: 128Mi
                      limits:
                        cpu: 2000m
                        memory: 768Mi
        target:
          kind: Deployment
          name: (kustomize-controller|helm-controller|source-controller)
      # image-reflector/image-automation-controller are idle almost all the time on this
      # cluster (no image scanning/patching load) - the chart default 1000m/1Gi limits are
      # unused headroom that just adds to node CPU-limit overcommit. Cap them lower.
      - patch: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: not-used
          spec:
            template:
              spec:
                containers:
                  - name: manager
                    resources:
                      limits:
                        cpu: 250m
                        memory: 256Mi
        target:
          kind: Deployment
          name: (image-reflector-controller|image-automation-controller)
      # Enable Helm near OOM detection
      # https://fluxcd.io/flux/cheatsheets/bootstrap/#enable-helm-near-oom-detection
      - patch: |
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --feature-gates=OOMWatch=true
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --oom-watch-memory-threshold=95
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --oom-watch-interval=500ms
        target:
          kind: Deployment
          name: helm-controller
      # Configure home-ops GitRepository
      - patch: |
          - op: replace
            path: /metadata/name
            value: home-ops
          - op: replace
            path: /spec/interval
            value: 2h
          - op: add
            path: /spec/ignore
            value: |
              # exclude all
              /*
              # include kubernetes directory only
              !/kubernetes
        target:
          kind: GitRepository
          name: flux-system
      # Configure flux-system Kustomization
      - patch: |
          - op: replace
            path: /spec/sourceRef/name
            value: home-ops
          - op: add
            path: /spec/targetNamespace
            value: flux-system
          - op: replace
            path: /spec/prune
            value: false
          - op: add
            path: /spec/decryption
            value:
              provider: sops
              secretRef:
                name: sops-age
        target:
          kind: Kustomization
          name: flux-system
  sync:
    kind: GitRepository
    url: ssh://git@github.com/icaruseffect/home-ops.git
    ref: refs/heads/main
    path: ./kubernetes/homelab
    pullSecret: ssh-credentials
