apiVersion: apps/v1
kind: Deployment
metadata:
  name: calibre-web-automated
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: calibre-web-automated
  template:
    metadata:
      labels:
        app: calibre-web-automated
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      containers:
        - name: calibre-web-automated
          image: crocodilestick/calibre-web-automated:v4.0.8 # {"$imagepolicy": "flux-system:calibre-web-automated"}
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "100"
            - name: TZ
              value: UTC
            - name: TRUSTED_PROXY_COUNT
              value: "1"
          ports:
            - name: http
              containerPort: 8083
          volumeMounts:
            - name: config
              mountPath: /config
            - name: calibre-library
              mountPath: /calibre-library
            - name: book-ingest
              mountPath: /cwa-book-ingest
          livenessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: config
        - name: calibre-library
          persistentVolumeClaim:
            claimName: calibre-library
        - name: book-ingest
          persistentVolumeClaim:
            claimName: book-ingest
