---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
spec:
  interval: 30m
  chart:
    spec:
      chart: openebs
      version: 4.x.x
      sourceRef:
        kind: HelmRepository
        name: openebs-charts
        namespace: flux-system
  install:
    remediation:
      retries: 3
    crds: CreateReplace
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
    crds: CreateReplace
  values:
    loki:
      enabled: false
    minio:
      enabled: false
    alloy:
      enabled: false
    localpv-provisioner:
      rbac:
        create: true
      localpv:
        basePath: /var/local/openebs
        image:
          registry: quay.io/
          repository: openebs/provisioner-localpv
      hostpathClass:
        name: openebs-hostpath
    openebs-crds:
      csi:
        volumeSnapshots:
          enabled: true
          keep: true # Changed to prevent CRD deletion conflicts
    zfs-localpv:
      enabled: false
    lvm-localpv:
      enabled: false
    mayastor:
      enabled: false
    engines:
      local:
        lvm:
          enabled: false
        zfs:
          enabled: false
      replicated:
        mayastor:
          enabled: false
