---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crowdsec-cilium-bouncer
  namespace: crowdsec
  labels:
    app.kubernetes.io/name: crowdsec-cilium-bouncer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crowdsec-cilium-bouncer
rules:
  - apiGroups: ["cilium.io"]
    resources: ["ciliumclusterwidenetworkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crowdsec-cilium-bouncer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crowdsec-cilium-bouncer
subjects:
  - kind: ServiceAccount
    name: crowdsec-cilium-bouncer
    namespace: crowdsec
