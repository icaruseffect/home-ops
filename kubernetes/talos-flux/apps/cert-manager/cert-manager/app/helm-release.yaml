---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  chart:
    spec:
      chart: cert-manager
      version: v1.15.3
      sourceRef:
        kind: HelmRepository
        name: jetstack-charts
        namespace: flux-system
      interval: 30m
  install:
    crds: CreateReplace
    remediation:
      retries: 5
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 5
  values:
    # Gateway API shim controller (cert-manager 1.15: config requires apiVersion/kind;
    # the gateway controller is behind the ExperimentalGatewayAPISupport feature gate)
    config:
      apiVersion: controller.config.cert-manager.io/v1alpha1
      kind: ControllerConfiguration
      featureGates:
        ExperimentalGatewayAPISupport: true
      # separate from the feature gate; defaults false even in 1.15
      enableGatewayAPI: true
    # https://artifacthub.io/packages/helm/cert-manager/cert-manager?modal=values
    installCRDs: true
    extraArgs:
      - --dns01-recursive-nameservers=192.174.68.104:53,45.87.158.53:53
      - --dns01-recursive-nameservers-only
      - --enable-certificate-owner-ref
    replicaCount: 1
    podDnsPolicy: "None"
    podDnsConfig:
      nameservers:
        - "192.174.68.104"
        - "45.87.158.53"
    resources:
      requests:
        cpu: 10m
        memory: 100Mi
      limits:
        memory: 100Mi
    cainjector:
      resources:
        requests:
          cpu: 10m
          memory: 223Mi
        limits:
          memory: 223Mi
    webhook:
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 100Mi
        limits:
          memory: 100Mi
