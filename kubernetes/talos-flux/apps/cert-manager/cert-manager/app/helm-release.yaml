---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  chart:
    spec:
      chart: cert-manager
      version: v1.15.3
      sourceRef:
        kind: HelmRepository
        name: cert-manager
        namespace: flux-system
      interval: 30m
  install:
    crds: CreateReplace
    remediation:
      retries: 5
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 5
  # Gateway API shim controller (cert-manager 1.15: config requires apiVersion/kind;
  # the gateway controller is behind the ExperimentalGatewayAPISupport feature gate)
  values:
    config:
      apiVersion: controller.config.cert-manager.io/v1alpha1
      kind: ControllerConfiguration
      featureGates:
        ExperimentalGatewayAPISupport: true
      # separate from the feature gate; defaults false even in 1.15
      enableGatewayAPI: true
    # https://artifacthub.io/packages/helm/cert-manager/cert-manager?modal=values
    installCRDs: true
    # extraEnv:
    #   - name: ACME_HTTP_RESOLVER_FAMILY
    #     value: "4" # Force IPv4 only
    #   - name: ACME_HTTP_RESOLVER_ADDRESS
    #     value: "8.8.8.8:53" # Use Google's DNS
    #   - name: GODEBUG
    #     value: "netdns=go+1,quichdrs=1,ipv6=0" # Disable IPv6
    # extraArgs:
    #   - --dns01-recursive-nameservers=8.8.8.8:53,,9.9.9.9:53,45.87.158.53:53
    #   - --dns01-recursive-nameservers-only
    #   - --enable-certificate-owner-ref
    replicaCount: 1
    # podDnsPolicy: "None"
    # podDnsConfig:
    #   nameservers:
    #     - "8.8.8.8"
    #     - "9.9.9.9"
    #     - "192.174.68.104"
    #     - "45.87.158.53"
    resources:
      requests:
        cpu: 10m
        memory: 100Mi
      limits:
        memory: 100Mi
    cainjector:
      resources:
        requests:
          cpu: 10m
          memory: 223Mi
        limits:
          memory: 223Mi
    webhook:
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 100Mi
        limits:
          memory: 100Mi
