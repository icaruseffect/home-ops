---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: enabled

spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ${SECRET_EMAIL}
    # preferredChain: ISRG Root X1
    privateKeySecretRef:
      name: letsencrypt-production
    solvers:
      # Gateway API solver: this cluster has no Cilium Ingress controller any
      # more, so the former `ingress` solver could never get an address and
      # renewals would fail. The challenge HTTPRoute attaches to the gateway's
      # plain-HTTP listener.
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: cilium-gateway
                namespace: kube-system
                sectionName: http
        selector:
          dnsZones:
            - "${SECRET_DOMAIN}"
