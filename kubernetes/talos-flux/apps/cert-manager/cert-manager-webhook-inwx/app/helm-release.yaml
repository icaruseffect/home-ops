---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-webhook-inwx
  namespace: cert-manager
spec:
  interval: 30m
  chartRef:
    kind: GitRepository
    name: cert-manager-webhook-inwx-fork
  install:
    crds: CreateReplace
    remediation:
      retries: 5
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 5
  values:
    replicaCount: 1
    groupName: cert-manager-webhook-inwx.github.com
