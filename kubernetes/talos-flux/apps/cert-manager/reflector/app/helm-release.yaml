---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reflector
spec:
  interval: 30m
  chart:
    spec:
      chart: reflector
      version: "9.x.x"
      sourceRef:
        kind: HelmRepository
        name: emberstack-charts
        namespace: flux-system
      interval: 30m
  install:
    crds: CreateReplace
    remediation:
      retries: 5
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 5
  # was unbounded (BestEffort-adjacent) - same class of fix as cilium
  # (see values.yaml there): give it real headroom over its observed steady
  # state (~150Mi RSS via metrics-server) rather than leave it uncapped.
  values:
    resources:
      requests:
        cpu: 10m
        memory: 160Mi
      limits:
        cpu: 250m
        memory: 320Mi
