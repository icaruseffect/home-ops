---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcpo
  namespace: app
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: mcpo
  template:
    metadata:
      labels:
        app: mcpo
    spec:
      imagePullSecrets:
        - name: regcred
      volumes:
        - name: mcpo-conf
          configMap:
            name: mcpo-conf
        - name: mcpo-data
          persistentVolumeClaim:
            claimName: mcpo-pvc
      containers:
        - name: mcpo
          image: ghcr.io/open-webui/mcpo:latest
          args:
            - --config
            - /app/config.json
            - --api-key
            - passwd
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: mcpo-conf
              mountPath: /app/config.json
              subPath: config.json
            - name: mcpo-data
              mountPath: /app/data
