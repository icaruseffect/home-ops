---
apiVersion: cilium.io/v2
kind: CiliumEnvoyConfig
metadata:
  name: ntfy-websocket
  namespace: ntfy
spec:
  services:
    - name: ntfy
      namespace: ntfy
      ports:
        - port: 80
  resources:
    - "@type": type.googleapis.com/envoy.config.listener.v3.Listener
      name: ntfy-websocket-listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ntfy_websocket
                upgrade_configs:
                  - upgrade_type: websocket
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: ntfy_service
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: ntfy-cluster
                            timeout: 0s
                            upgrade_configs:
                              - upgrade_type: websocket
                                enabled: true
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
    - "@type": type.googleapis.com/envoy.config.cluster.v3.Cluster
      name: ntfy-cluster
      connect_timeout: 5s
      type: STRICT_DNS
      load_assignment:
        cluster_name: ntfy-cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ntfy.ntfy.svc.cluster.local
                      port_value: 80
