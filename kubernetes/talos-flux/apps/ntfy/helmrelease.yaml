---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ntfy
  namespace: ntfy
spec:
  chart:
    spec:
      chart: ntfy
      version: "0.x.x"
      sourceRef:
        kind: HelmRepository
        name: wrenix-charts
        namespace: flux-system
  interval: 10m0s
  timeout: 10m0s
  values:
    ntfy:
      auth:
        file: "/data/user.db"
        defaultAccess: "deny-all"

      webPush.keys.create: true
      # behindProxy: true
      enableLogin: true
      baseURL: https://ntfy.${SECRET-DOMAIN}
      cache.file: /data/auth.db
      behindProxy: true
      enableReservations: true
    ingress:
      # main:
      enabled: true
      className: cilium
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-production
      hosts:
        - host: ntfy.${SECRET-DOMAIN}
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - ntfy.${SECRET-DOMAIN}
          secretName: ntfy-tls
    persistence:
      enabled: true
      storageClass: openebs-hostpath
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
    grafana.dashboards.enabled: true
