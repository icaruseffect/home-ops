---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ntfy
  namespace: ntfy
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: kube-system
      sectionName: https-ntfy.${SECRET_DOMAIN}
    - name: cilium-gateway
      namespace: kube-system
      sectionName: http
  hostnames:
    - ntfy.${SECRET_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ntfy
          port: 80
