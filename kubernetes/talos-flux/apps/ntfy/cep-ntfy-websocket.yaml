---
apiVersion: cilium.io/v2
kind: CiliumEnvoyConfig
metadata:
  name: ntfy-websocket-config
  namespace: ntfy
spec:
  services:
    - name: ntfy
      namespace: ntfy
  static_resources:
    clusters:
      - name: cluster1
        type: ORIGINAL_DST
        lb_policy: CLUSTER_PROVIDED
        connect_timeout:
          seconds: 1
      - name: xds-grpc-cilium
        connect_timeout:
          seconds: 5
        type: STATIC
        lb_policy: ROUND_ROBIN
        http2_protocol_options:
        load_assignment:
          cluster_name: xds-grpc-cilium
          endpoints:
            - lb_endpoints:
                - endpoint:
                    address:
                      pipe:
                        path: /var/run/cilium/xds.sock
    listeners:
      - name: listener_0
        address:
          socket_address:
            address: 127.0.0.1
            port_value: 0
        listener_filters:
          - name: cilium.bpf_metadata
            typed_config:
              "@type": type.googleapis.com/cilium.BpfMetadata
              is_ingress: true
        filter_chains:
          - filters:
              - name: cilium.network.websocket.server
                typed_config:
                  "@type": type.googleapis.com/cilium.WebSocketServer
                  access_log_path: "/var/run/cilium/accesslog.sock"
                  origin: "ntfy.${SECRET_DOMAIN}"
              - name: cilium.network
                typed_config:
                  "@type": type.googleapis.com/cilium.NetworkFilter
              - name: envoy.tcp_proxy
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                  stat_prefix: tcp_stats
                  cluster: cluster1
