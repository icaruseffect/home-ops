---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ntfy-allow-internet-nextcloud
  namespace: ntfy
spec:
  endpointSelector:
    matchLabels:
      "k8s:app.kubernetes.io/instance": "ntfy"
      "k8s:app.kubernetes.io/name": "ntfy"
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:app.kubernetes.io/instance": "nextcloud"
            "k8s:app.kubernetes.io/name": "nextcloud"
            "k8s:app.kubernetes.io/component": "app"
            "k8s:io.kubernetes.pod.namespace": "cloud"
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    - fromEntities:
        - world
        - ingress
        - host
        - cluster
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
