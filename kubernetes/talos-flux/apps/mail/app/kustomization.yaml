---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mail
resources:
  - helm-release.yaml
  - httproute.yaml
  - mail-ports-external.yaml
  - secret-env-stalwart.sops.yaml
  - servicemonitor.yaml
  - tls-certificate.yaml
configMapGenerator:
  - name: values-stalwart-mail
    namespace: mail
    files:
      - values.yaml
configurations:
  - kustomizeconfig.yaml
generatorOptions:
  disableNameSuffixHash: true
