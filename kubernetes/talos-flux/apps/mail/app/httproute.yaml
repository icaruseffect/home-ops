---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stalwart-mail
  namespace: mail
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: kube-system
      sectionName: https-mail.${SECRET_DOMAIN}
    - name: cilium-gateway
      namespace: kube-system
      sectionName: http
  hostnames:
    - mail.${SECRET_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # CrowdSec ban enforcement via envoy ext_authz (bouncer in ns crowdsec;
      # requires a ReferenceGrant entry for this namespace)
      filters:
        - type: ExternalAuth
          externalAuth:
            protocol: GRPC
            grpc: {}
            backendRef:
              group: ""
              kind: Service
              name: envoy-crowdsec-bouncer
              namespace: crowdsec
              port: 8080
      backendRefs:
        - name: stalwart-mail
          port: 80
