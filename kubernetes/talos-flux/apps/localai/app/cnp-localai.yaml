---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: localai-policy
  namespace: localai
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: local-ai
      app.kubernetes.io/instance: localai
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: hoarder-web
            "k8s:io.kubernetes.pod.namespace": hoarder
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toFQDNs:
        - matchPattern: "*"
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
