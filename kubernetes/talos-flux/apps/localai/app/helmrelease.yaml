---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: localai
  namespace: localai
spec:
  interval: 5m
  chart:
    spec:
      chart: local-ai
      version: ">=3.0.0 <4.0.0"
      sourceRef:
        kind: HelmRepository
        name: localai-charts
        namespace: flux-system
      interval: 5m
  # chart:
  #   spec:
  #     chart: local-ai
  #     version: latest
  #     sourceRef:
  #       kind: HelmRepository
  #       name: localai-charts
  #       namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: localai-helm-values
