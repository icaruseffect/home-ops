---
# The prometheus-pushgateway chart (1.x) has no Gateway API route support,
# so this raw HTTPRoute carries pushgateway.${SECRET_DOMAIN}. The chart's
# Ingress is disabled at cutover (Phase D3).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus-pushgateway
  namespace: observability
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: kube-system
      sectionName: https-pushgateway.${SECRET_DOMAIN}
    - name: cilium-gateway
      namespace: kube-system
      sectionName: http
  hostnames:
    - pushgateway.${SECRET_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: prometheus-pushgateway
          port: 9091
