---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: velero-progress-exporter
  namespace: observability
spec:
  namespaceSelector:
    matchNames:
      - velero
  selector:
    matchLabels:
      app.kubernetes.io/name: velero-progress-exporter
  podMetricsEndpoints:
    - port: http
      interval: 30s
