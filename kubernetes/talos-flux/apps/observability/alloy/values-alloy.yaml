---
alloy:
  configMap:
    create: false
    name: alloy-config
    key: config.alloy

  clustering:
    enabled: false

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      # 512Mi sat at 99.96% of memory.max with workingset_refault_file
      # climbing (~320/s over 10s, live 2026-10-28) — the same
      # limit-bound refault mechanism that crash-looped kube-apiserver
      # on homelab 2026-09-29. 768Mi keeps ~45% headroom over the
      # measured ~530MB working set.
      memory: 768Mi

  # Backs prometheus.remote_write WAL and loki tail positions.
  storagePath: /tmp/alloy

  mounts:
    # storagePath on the container's writable overlay is disk-backed on
    # contabo-de-1 (verified live: overlay 599G, 71% used) — a stuck
    # write-retry loop reading its own WAL back starves whatever shares
    # that disk (see the homelab 2026-09-29 incident). tmpfs keeps that
    # I/O off disk; sizeLimit bounds it so a runaway WAL OOM-kills the
    # pod instead of filling memory.
    extra:
      - name: alloy-storage
        mountPath: /tmp/alloy

# The default 30s reload timeout is shorter than a full config evaluation on
# this node (27-83s per component under load), so the reloader retried every
# 30s and each retry restarted a reload: a self-feeding loop. customArgs
# replaces the chart's default args, so they are restated here.
configReloader:
  customArgs:
    - --watched-dir=/etc/alloy
    - --reload-url=http://localhost:12345/-/reload
    - --reload-timeout=5m

controller:
  type: deployment
  # Single replica on the talos cluster (user decision 2026-10-28).
  replicas: 1
  volumes:
    extra:
      - name: alloy-storage
        emptyDir:
          medium: Memory
          sizeLimit: 128Mi

rbac:
  create: true

crds:
  create: false

serviceMonitor:
  enabled: false
