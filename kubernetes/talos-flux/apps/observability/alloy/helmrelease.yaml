---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: observability
spec:
  interval: 30m
  timeout: 10m

  chart:
    spec:
      chart: alloy
      version: "1.x.x"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: observability
      interval: 1h

  releaseName: alloy

  dependsOn:
    - name: prometheus-operator-crds
      namespace: observability
    - name: greptimedb
      namespace: observability

  install:
    createNamespace: false
    remediation:
      retries: 3

  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback

  driftDetection:
    mode: enabled

  valuesFrom:
    - kind: ConfigMap
      name: alloy-values
      valuesKey: values-alloy.yaml

  postRenderers:
    - kustomize:
        patches:
          - target:
              version: v1
              kind: Deployment
              name: alloy
            patch: |
              - op: add
                path: /spec/template/metadata/annotations/configmap.reloader.stakater.com~1reload
                value: alloy-config
