---
# https://grafana.com/docs/grafana/latest/datasources/
apiVersion: 1
# list of datasources that should be deleted from the database
deleteDatasources:
  - name: Loki
    orgId: 1
  - name: Prometheus
    orgId: 1
  - name: GitHub
    orgId: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://greptimedb-standalone.observability.svc.cluster.local:4000/v1/prometheus
    isDefault: true
  - name: GreptimeDB
    type: info8fcc-greptimedb-datasource
    access: proxy
    uid: greptimedb
    jsonData:
      host: http://greptimedb-standalone.observability.svc.cluster.local:4000
      protocol: http
      defaultDatabase: public
      logs:
        defaultDatabase: logs
        defaultTable: app_logs
        timeColumn: greptime_timestamp
        messageColumn: message
        levelColumn: level
  - name: GitHub
    type: grafana-github-datasource
    jsonData:
      owner: tyriis
      repository: home-ops
    secureJsonData:
      accessToken: $GITHUB_PAT
