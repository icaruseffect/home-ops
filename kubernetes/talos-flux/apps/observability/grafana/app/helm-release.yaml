---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
spec:
  interval: 30m
  timeout: 20m
  chart:
    spec:
      chart: grafana
      version: 8.x
      sourceRef:
        kind: HelmRepository
        name: grafana-charts
        namespace: flux-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    replicas: 1
    env:
      TZ: ${SETTING_TZ}
      GF_EXPLORE_ENABLED: "true"
      GF_PANELS_DISABLE_SANITIZE_HTML: "true"
      GF_DATE_FORMATS_USE_BROWSER_LOCALE: "true"
      GF_LOG_LEVEL: info
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: "true"
      DS_PROMETHEUS: prometheus
    admin:
      existingSecret: grafana-admin
      userKey: USERNAME
      passwordKey: PASSWORD
    grafana.ini:
      plugins:
        allow_loading_unsigned_plugins: info8fcc-greptimedb-datasource
      root_url: https://grafana.${SECRET_DOMAIN}
      users:
        auto_assign_org_role: Admin
      auth.generic_oauth:
        enabled: true
        name: Authelia
        client_id: S6qBYTjUtqcpItGmutya3q6Qd2VXcH2TdvBtpLF8
        scopes: openid profile email
        auth_url: https://auth.${SECRET_DOMAIN}/api/oidc/authorization
        token_url: https://auth.${SECRET_DOMAIN}/api/oidc/token
        api_url: https://auth.${SECRET_DOMAIN}/api/oidc/userinfo
    dashboards:
      default:
        Node Exporter for Prometheus Dashboard:
          gnetId: 11074
          revision: 9
          datasource: Prometheus
    sidecar:
      dashboards:
        enabled: true
        searchNamespace: ALL
        label: grafana_dashboard
        folderAnnotation: grafana_folder
        provider:
          foldersFromFilesStructure: true
      datasources:
        enabled: true
        searchNamespace: ALL
    plugins:
      - grafana-piechart-panel
      - grafana-worldmap-panel
      - grafana-clock-panel
      - grafana-github-datasource
      - https://github.com/GreptimeTeam/greptimedb-grafana-datasource/releases/download/v3.0.3/info8fcc-greptimedb-datasource-unsigned.zip;info8fcc-greptimedb-datasource
    serviceMonitor:
      enabled: true
    route:
      main:
        enabled: true
        hostnames: ["grafana.${SECRET_DOMAIN}"]
        parentRefs:
          - name: cilium-gateway
            namespace: kube-system
            sectionName: https-grafana.${SECRET_DOMAIN}
          - name: cilium-gateway
            namespace: kube-system
            sectionName: http
        # CrowdSec ban enforcement via envoy ext_authz (bouncer in ns
        # crowdsec; requires a ReferenceGrant entry for this namespace)
        filters:
          - type: ExternalAuth
            externalAuth:
              protocol: GRPC
              grpc: {}
              backendRef:
                group: ""
                kind: Service
                name: envoy-crowdsec-bouncer
                namespace: crowdsec
                port: 8080
    ingress: null
    enabled: true
    ingressClassName: cilium
    annotations: null
    cert-manager.io/cluster-issuer: letsencrypt-production
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: Metrics, logs, traces, and profiles, oh my!
    gethomepage.dev/group: Observability
    gethomepage.dev/icon: grafana
    gethomepage.dev/name: Grafana Dashboard
    gethomepage.dev/weight: "10"
    hosts:
      - grafana.${SECRET_DOMAIN}
    path: /
    pathType: Prefix
    tls:
      - secretName: grafana.${SECRET_DOMAIN}-tls
        hosts:
          - grafana.${SECRET_DOMAIN}
    serviceAccount:
      create: true
      autoMount: true
    persistence:
      enabled: true
      type: pvc
      storageClassName: openebs-hostpath
      accessModes:
        - ReadWriteOnce
      size: 5Gi
      finalizers:
        - kubernetes.io/pvc-protection
    createConfigmap: true
    extraConfigmapMounts:
      - name: grafana-contactpoints
        mountPath: /etc/grafana/provisioning/alerting/contactpoints.yaml
        subPath: contactpoints.yaml
        configMap: grafana-contactpoints
        readOnly: true
      - name: grafana-datasources
        mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
        subPath: datasources.yaml
        configMap: grafana-datasources
        readOnly: true
      - name: grafana-policies
        mountPath: /etc/grafana/provisioning/alerting/policies.yaml
        subPath: policies.yaml
        configMap: grafana-policies
        readOnly: true
    envFromSecrets:
      - name: grafana-env
    initChownData:
      enabled: false
