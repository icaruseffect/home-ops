---
alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ["alertname", "job"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 3h
      receiver: "ntfy"
      routes:
        - receiver: "null"
          match:
            alertname: Watchdog
        - receiver: "null"
          match:
            alertname: InfoInhibitor
          continue: true
        - receiver: ntfy
          match_re:
            severity: critical
          continue: true
    inhibit_rules:
      - source_match:
          severity: critical
        target_match:
          severity: warning
        equal: ["alertname", "namespace"]

    receivers:
      - name: "null"
      - name: "ntfy"
        webhook_configs:
          - url: "https://ntfy.${SECRET_DOMAIN}/Monitoring?template=alertmanager"
            send_resolved: true
            http_config:
              authorization:
                credentials_file: /etc/alertmanager/secrets/ntfy-secret/token

  ingress:
    enabled: true
    ingressClassName: cilium
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-production
      kubernetes.io/tls-acme: "true"
      traefik.ingress.kubernetes.io/router.middlewares: traefik-ingress-sso@kubernetescrd
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/affinity: "true"
      traefik.ingress.kubernetes.io/router.tls: "true"
      external-dns/opnsense: "true"
      hajimari.io/appName: alertmanager
      hajimari.io/enable: "true"
      hajimari.io/icon: clipboard-alert
      gethomepage.dev/enabled: "true"
      gethomepage.dev/description: Alerting system that works with Prometheus
      gethomepage.dev/group: Observability
      gethomepage.dev/icon: alertmanager
      gethomepage.dev/name: Alertmanager
      gethomepage.dev/weight: "10" # optional
      gethomepage.dev/pod-selector: app.kubernetes.io/name=alertmanager
    hosts:
      - &host alertmanager.${SECRET_DOMAIN}
    tls:
      - secretName: alertmanager-tls
        hosts:
          - *host
  alertmanagerSpec:
    externalUrl: https://alertmanager.${SECRET_DOMAIN}/
    secrets:
      - ntfy-secret
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: openebs-hostpath
          resources:
            requests:
              storage: 1Gi
