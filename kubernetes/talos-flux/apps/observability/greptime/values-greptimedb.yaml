---
image:
  registry: docker.io
  repository: greptime/greptimedb
  # Pin explicitly — do not inherit a beta appVersion from the chart.
  tag: v1.1.0

# Single-node: local PVC, no object storage backend.
objectStorage: {}

persistence:
  enabled: true
  storageClass: openebs-hostpath
  size: 20Gi
  mountPath: /data/greptimedb

dataHome: /data/greptimedb/

# Keep logs out of the PVC; let your log shipper handle stdout.
logging:
  level: info
  format: json
  onlyLogToStdout: true

service:
  type: ClusterIP

# You flagged this as a prerequisite — set them from the start.
resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    memory: 2Gi

# Emit a PodMonitor so the existing Prometheus scrapes Greptime itself
# while you run both side by side.
monitoring:
  enabled: true
  interval: 30s
  labels:
    release: kube-prometheus-stack

podSecurityContext:
  fsGroup: 10001
  runAsUser: 10001
  runAsGroup: 10001
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

# Memory ceilings for the mito engine — the defaults assume a server,
# not a laptop. Verify key names against the config docs for your pinned
# version; they have shifted between releases.
configToml: |
  [[region_engine]]
  [region_engine.mito]
  global_write_buffer_size = "128MB"
  global_write_buffer_reject_size = "256MB"
  sst_meta_cache_size = "32MB"
  vector_cache_size = "32MB"
  page_cache_size = "64MB"
