---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hoarder
  namespace: hoarder
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: kube-system
      sectionName: https-hoarder.${SECRET_DOMAIN}
    - name: cilium-gateway
      namespace: kube-system
      sectionName: http
  hostnames:
    - hoarder.${SECRET_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hoarder-web
          port: 3000
