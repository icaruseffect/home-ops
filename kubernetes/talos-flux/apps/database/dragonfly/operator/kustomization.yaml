---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # CRDs and RBAC are managed by the official Helm chart itself
  # (crds.install/keep, createAggregateRoles) - see helm-release.yaml
  - dragonfly-operator-git.yaml
  - helm-release.yaml
configMapGenerator:
  - name: dragonfly-dashboard
    files:
      # renovate: datasource=github-releases depName=dragonflydb/dragonfly-operator
      - dragonfly-dashboard.json=https://raw.githubusercontent.com/dragonflydb/dragonfly-operator/v1.6.1/monitoring/grafana-dashboard.json
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
    grafana_folder: "dragonfly"
  labels:
    grafana_dashboard: "true"
