---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: postgres17-backup-store
  namespace: database
spec:
  configuration:
    destinationPath: s3://s3proxy/postgres17
    endpointURL: http://rclone-s3-proxy.s3proxy.svc.cluster.local:8080
    s3Credentials:
      accessKeyId:
        name: rclone-s3-proxy-auth
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: rclone-s3-proxy-auth
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
      maxParallel: 2
    data:
      compression: gzip
      jobs: 2
  retentionPolicy: "30d"
  instanceSidecarConfiguration:
    retentionPolicyIntervalSeconds: 1800
    env:
      # Required for rclone serve s3 — boto3 >=1.36 sends checksum headers
      # that non-AWS S3 implementations often reject (x-amz-content-sha256).
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
