---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres17
  namespace: database
spec:
  enableSuperuserAccess: true
  # node is CPU-oversubscribed; default 1s liveness timeouts caused a
  # shutdown/restart storm on the single instance
  probes:
    liveness:
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 6
    readiness:
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 6
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  primaryUpdateStrategy: unsupervised
  bootstrap:
    initdb:
      database: postgres
      owner: postgres
      secret:
        name: postgres-superuser
  storage:
    pvcTemplate:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
      storageClassName: openebs-hostpath
      volumeMode: Filesystem
  superuserSecret:
    name: postgres-superuser
  monitoring:
    enablePodMonitor: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres17-backup-store
  managed:
    roles:
      - name: authentik
        ensure: present
        login: true
        passwordSecret:
          name: db-secret-authentik
      - name: miniflux
        ensure: present
        login: true
        passwordSecret:
          name: psql-miniflux
      - name: authelia
        ensure: present
        login: true
        passwordSecret:
          name: authelia-db-app
