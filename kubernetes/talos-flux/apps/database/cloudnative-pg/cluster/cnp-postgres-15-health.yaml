---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: postgres15-health
  namespace: database
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: postgres15
  ingress:
    # Allow health checks from anywhere in cluster
    - fromEntities:
        - cluster
        - host
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "5432"
              protocol: TCP
            - port: "9187"
              protocol: TCP
  egress:
    # Allow DNS
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Allow all outbound for now
    - toEntities:
        - cluster
