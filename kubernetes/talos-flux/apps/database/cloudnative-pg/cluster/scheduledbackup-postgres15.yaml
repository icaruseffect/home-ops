---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres15-daily
  namespace: database
spec:
  # CNPG cron is 6-field (seconds first): 03:00 daily
  schedule: "0 0 3 * * *"
  backupOwnerReference: self
  immediate: true
  cluster:
    name: postgres15
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
