---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres15
  namespace: database
spec:
  instances: 1
  # node is CPU-oversubscribed; default 1s liveness timeouts cause
  # shutdown/restart storms on the single instance
  probes:
    liveness:
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 6
    readiness:
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 6
  imageName: ghcr.io/cloudnative-pg/postgresql:15.3
  primaryUpdateStrategy: unsupervised
  bootstrap:
    initdb:
      database: postgres
      owner: postgres
      secret:
        name: postgres-superuser
  storage:
    pvcTemplate:
      storageClassName: openebs-hostpath
      volumeMode: Filesystem
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 30Gi
  superuserSecret:
    name: postgres-superuser
  monitoring:
    enablePodMonitor: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres15-backup-store
