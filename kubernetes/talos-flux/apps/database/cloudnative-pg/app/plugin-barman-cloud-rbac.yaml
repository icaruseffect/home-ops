---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: plugin-barman-cloud-objectstores
  labels:
    app.kubernetes.io/instance: plugin-barman-cloud
rules:
  - apiGroups: ["barmancloud.cnpg.io"]
    resources: ["objectstores"]
    verbs: ["get", "list", "watch"]
  # Needed to inspect Role/ClusterRole references inside ObjectStore specs (e.g., to verify permissions).
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "clusterroles", "rolebindings", "clusterrolebindings"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: plugin-barman-cloud-objectstores
  labels:
    app.kubernetes.io/instance: plugin-barman-cloud
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: plugin-barman-cloud-objectstores
subjects:
  - kind: ServiceAccount
    name: plugin-barman-cloud
    namespace: database
