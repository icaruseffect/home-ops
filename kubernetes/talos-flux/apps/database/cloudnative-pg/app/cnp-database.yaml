---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: postgres15-allow-probes
  namespace: database
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: postgres15
  ingress:
    # Allow kubelet health probes (from node)
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # Allow PostgreSQL connections
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cloud
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Allow CNPG operator communication
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "5432"
              protocol: TCP
