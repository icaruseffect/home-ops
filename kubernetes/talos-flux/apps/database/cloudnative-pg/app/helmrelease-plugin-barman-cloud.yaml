---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plugin-barman-cloud
spec:
  interval: 30m
  chart:
    spec:
      chart: plugin-barman-cloud
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg-charts
        namespace: flux-system
      version: 0.x
  timeout: 10m # slow node: don't let a 5m wait trigger a rollback
  install:
    remediation:
      retries: 3
  upgrade:
    disableWait: true
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  dependsOn:
    - name: cloudnative-pg
      namespace: database
  values:
    # Single replica; the operator exited whenever a lease renewal was missed.
    # Appended after the chart's hard-coded --leader-elect, so this wins.
    additionalArgs:
      - --leader-elect=false
    crds:
      enabled: true
      keep: true
    # cert-manager assumed already installed cluster-wide
    cert-manager:
      enabled: false
