---
# Client certificate for barman-cloud plugin mTLS. The chart 0.9.0 created
# this; pinning to 0.8.1 broke the CR -> secret linkage.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: barman-cloud-client
  namespace: database
spec:
  commonName: barman-cloud-client
  secretName: barman-cloud-client-tls
  duration: 2160h
  renewBefore: 360h
  usages:
    - client auth
  issuerRef:
    kind: Issuer
    name: barman-cloud-ca