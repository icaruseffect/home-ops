---
# Allow the homeassistant HTTPRoute to use the CrowdSec bouncer as ExternalAuth backend
# (own grant instead of extending crowdsec/bouncer-grpc-from-cloud).
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: bouncer-grpc-from-homeassistant
  namespace: crowdsec
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: homeassistant
  to:
    - group: ""
      kind: Service
      name: envoy-crowdsec-bouncer
---
# ... and Authelia's ext-authz endpoint.
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: authelia-from-homeassistant
  namespace: authelia
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: homeassistant
  to:
    - group: ""
      kind: Service
      name: authelia
