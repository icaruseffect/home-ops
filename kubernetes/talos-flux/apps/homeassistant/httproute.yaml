---
# Home Assistant (homelab cluster). Only attached to the HTTPS listener: app
# tokens and webhook ids must not travel in cleartext.
#
# Cilium honours only ONE ExternalAuth filter per rule, and CrowdSec takes
# priority: it is the ban enforcement used on every public host. Authentication
# is Home Assistant's own login, which uses Authelia as OpenID Connect provider
# (client "Home Assistant" in the Authelia values, redirect URI
# https://ha.${SECRET_DOMAIN}/auth/openid/callback).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant
  namespace: homeassistant
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: kube-system
      sectionName: https-ha.${SECRET_DOMAIN}
  hostnames:
    - ha.${SECRET_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExternalAuth
          externalAuth:
            protocol: GRPC
            grpc: {}
            backendRef:
              group: ""
              kind: Service
              name: envoy-crowdsec-bouncer
              namespace: crowdsec
              port: 8080
        # the homelab ingress only matches this host
        - type: URLRewrite
          urlRewrite:
            hostname: hass.lab.lan
      backendRefs:
        - name: home-assistant
          port: 80
