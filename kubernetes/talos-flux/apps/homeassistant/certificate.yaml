---
# TLS for the Home Assistant listener on kube-system/cilium-gateway
# (listener `https-ha.${SECRET_DOMAIN}`, see README for the listener snippet).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gw-ha.${SECRET_DOMAIN}-tls
  namespace: kube-system
spec:
  secretName: gw-ha.${SECRET_DOMAIN}-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - ha.${SECRET_DOMAIN}
