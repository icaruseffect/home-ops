---
# Permanent raw route for auth.${SECRET_DOMAIN}. The authelia chart's
# `ingress.gatewayAPI` renders the HTTPRoute as an Ingress *replacement*
# (single gate on ingress.enabled), which would strand the host between
# Phase B and the cilium cutover — so the route lives here instead, and the
# chart's ingress block is dropped at cutover (never set gatewayAPI.enabled).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authelia
  namespace: authelia
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: kube-system
      sectionName: https-auth.${SECRET_DOMAIN}
    - name: cilium-gateway
      namespace: kube-system
      sectionName: http
  hostnames:
    - auth.${SECRET_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # CrowdSec ban enforcement via envoy ext_authz (bouncer in ns crowdsec;
      # requires a ReferenceGrant entry for this namespace)
      filters:
        - type: ExternalAuth
          externalAuth:
            protocol: GRPC
            grpc: {}
            backendRef:
              group: ""
              kind: Service
              name: envoy-crowdsec-bouncer
              namespace: crowdsec
              port: 8080
      backendRefs:
        - name: authelia
          port: 80
