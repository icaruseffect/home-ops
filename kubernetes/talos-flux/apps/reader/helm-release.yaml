---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: miniflux
  namespace: reader
spec:
  interval: 25m
  chart:
    spec:
      chart: miniflux
      version: 0.9.2
      sourceRef:
        kind: HelmRepository
        name: gabe565-charts
        namespace: flux-system
  values:
    image:
      tag: 2.3.4 # {"$imagepolicy": "flux-system:miniflux"}
    envFrom:
      - secretRef:
          name: miniflux
    env:
      - name: RUN_MIGRATIONS
        value: "1"
      - name: DATABASE_URL
        valueFrom:
          secretKeyRef:
            name: psql-miniflux
            key: dbConnectionString
      - name: TRUSTED_REVERSE_PROXY_NETWORKS
        value: "10.244.0.0/24,fd00::/8"
    ingress:
      main:
        enabled: true
        className: cilium
        hosts:
          - host: &host reader.${SECRET_DOMAIN}
            paths:
              - path: /
        tls:
          - secretName: reader.${SECRET_DOMAIN}-tls
            hosts:
              - *host
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-production
    postgresql:
      enabled: false
    serviceMonitor:
      main:
        enabled: true
        allowedNetworks: 10.244.0.0/24
