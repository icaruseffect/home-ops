---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: klingel-cloud-site
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: klingel-cloud-site
  template:
    metadata:
      labels:
        app: klingel-cloud-site
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: static-web-server
          image: ghcr.io/static-web-server/static-web-server:2-alpine
          command: ["static-web-server"]
          args:
            - --host=0.0.0.0
            - --port=8080
            - --root=/public
            # ConfigMap volume mounts are always symlinks (..data -> timestamped
            # dir); this server refuses to follow symlinks by default.
            - --disable-symlinks=false
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 16Mi
          volumeMounts:
            - name: content
              mountPath: /public
              readOnly: true
          livenessProbe:
            httpGet:
              path: /robots.txt
              port: http
          readinessProbe:
            httpGet:
              path: /robots.txt
              port: http
      volumes:
        - name: content
          configMap:
            name: klingel-cloud-site
