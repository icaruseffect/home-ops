---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: klingel-cloud-site
  namespace: default
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: kube-system
      sectionName: https-${SECRET_DOMAIN}
    - name: cilium-gateway
      namespace: kube-system
      sectionName: http
  hostnames:
    - ${SECRET_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: klingel-cloud-site
          port: 80
