---
apiVersion: v1
kind: ConfigMap
metadata:
  name: klingel-cloud-site
  namespace: default
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8" />
      <title>$(SECRET_DOMAIN)</title>
      <meta name="viewport" content="width=device-width, initial-scale=1" />
    </head>
    <body>
      <p>
        For questions about mail systems operated under this domain, or to
        report abuse or delivery problems, please contact:
        <a href="mailto:postmaster@$(SECRET_DOMAIN)">postmaster@$(SECRET_DOMAIN)</a>
      </p>
    </body>
    </html>
  robots.txt: |
    User-agent: *
    Disallow: /
