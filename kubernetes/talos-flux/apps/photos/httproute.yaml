---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: noodle-gallery
  namespace: photos
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: kube-system
      sectionName: https-photos.${SECRET_DOMAIN}
    - name: cilium-gateway
      namespace: kube-system
      sectionName: http
  hostnames:
    - photos.${SECRET_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # CrowdSec ban enforcement via envoy ext_authz (bouncer in ns crowdsec;
      # requires a ReferenceGrant entry for this namespace)
      filters:
        - type: ExternalAuth
          externalAuth:
            # HTTP mode: cilium leaves GrpcService.Timeout unset → envoy's
            # 200ms default (cilium#48906); the bouncer serves Check on :8081
            # where the HTTP transport gets its proper timeout.
            protocol: HTTP
            http: {}
            backendRef:
              group: ""
              kind: Service
              name: envoy-crowdsec-bouncer
              namespace: crowdsec
              port: 8081
      backendRefs:
        - name: noodle-gallery-server
          port: 2283
