---
# Velociraptor is out-of-band managed (no Flux kustomization); this file
# documents the hand-applied HTTPRoutes for both exposed services.
# frontend:8000 (velo) and gui:8889 (velo-gui).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: velociraptor-frontend
  namespace: velociraptor
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: kube-system
      sectionName: https-velo.${SECRET_DOMAIN}
    - name: cilium-gateway
      namespace: kube-system
      sectionName: http
  hostnames:
    - velo.${SECRET_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: velociraptor
          port: 8000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: velociraptor-gui
  namespace: velociraptor
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: kube-system
      sectionName: https-velo-gui.${SECRET_DOMAIN}
    - name: cilium-gateway
      namespace: kube-system
      sectionName: http
  hostnames:
    - velo-gui.${SECRET_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: velociraptor
          port: 8889
