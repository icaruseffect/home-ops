apiVersion: batch/v1
kind: Job
metadata:
  name: restic-restore
spec:
  template:
    spec:
      containers:
        - name: restic
          image: restic/restic:latest
          command:
            - /bin/sh
            - -c
            - |
              # Create .ssh directory with correct permissions
              #mkdir -p ~/.ssh
              #chmod 700 ~/.ssh

              # Add host key to known_hosts
              #ssh-keyscan -H $SFTP_HOST >> ~/.ssh/known_hosts
              #chmod 600 ~/.ssh/known_hosts

              # Test SSH connection
              #ssh -v -T $SFTP_USER@$SFTP_HOST || exit 1

              # Run restore command
              #restic -r sftp:$SFTP_USER@$SFTP_HOST:$BACKUP_PATH restore latest --target /restore
              restic -r rclone:contabo-s3:velero/homelab/restic/paperless
          env:
            - name: RESTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: restic-password
                  key: password
            - name: SFTP_HOST
              value: your-sftp-host
            - name: SFTP_USER
              value: your-sftp-username
            - name: BACKUP_PATH
              value: /path/to/backup
          volumeMounts:
            - name: ssh-dir
              mountPath: /root/.ssh
            - name: restore-data
              mountPath: /restore
      volumes:
        - name: ssh-dir
          secret:
            secretName: sftp-ssh-key
            defaultMode: 384
            items:
              - key: id_rsa
                path: id_rsa
                mode: 384
              - key: id_rsa.pub
                path: id_rsa.pub
                mode: 420
              - key: config
                path: config
                mode: 384
        - name: restore-data
          # Define your volume for restored data (e.g., emptyDir, PVC, etc.)
          emptyDir: {}
      restartPolicy: Never
