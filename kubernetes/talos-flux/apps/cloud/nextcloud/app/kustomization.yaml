---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloud
resources:
  - helm-release.yaml
  - cm-pre-upgrade.yaml
  - cm-post-upgrade.yaml
  # restored after the accidental kustomize-controller sync pruned it; keep
  # it flux-owned so drift detection does not delete it again
  - cm-db-override.yaml
  - rbac-database-creator.yaml

configMapGenerator:
  - name: nextcloud-helm-values
    namespace: cloud
    files:
      - values.yaml
configurations:
  - kustomizeconfig.yaml
generatorOptions:
  disableNameSuffixHash: true
