---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dbman
  namespace: database
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-pg
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: database
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloud
      ports:
        - protocol: TCP
          port: 5432
