---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/image.toolkit.fluxcd.io/imagepolicy_v1.json
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: nextcloud
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: nextcloud
  policy:
    semver:
      # stay on 35.x; tags are "35.0.2-apache"
      range: '>=35.0.0 <36.0.0'
  filterTags:
    pattern: '^(?P<version>[0-9]+\.[0-9]+\.[0-9]+)-apache$'
    extract: '$version'
