---
# CiliumNetworkPolicy to allow traffic
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: nextcloud-push
  namespace: cloud
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: nextcloud
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: cilium
      toPorts:
        - ports:
            - port: "7867"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: nextcloud-ingress
  namespace: cloud
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: nextcloud
      app.kubernetes.io/instance: nextcloud
  ingress:
    # Allow HTTP traffic from Cilium ingress
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: cilium
      toPorts:
        - ports:
            - port: "80" # Main Nextcloud port
              protocol: TCP
            - port: "7867" # Push notifications port
              protocol: TCP
    # Allow traffic from Redis
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: redis
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    # Allow traffic from PostgreSQL
    - fromEndpoints:
        - matchLabels:
            cnpg.io/cluster: postgres17
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Allow traffic from prometheus
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9205"
              protocol: TCP
  egress:
    # Allow Redis access
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: redis
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    # Allow Dragonfly access
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: dragonfly
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    # Allow PostgreSQL access
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: postgres17-rw
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Allow DNS lookups
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Allow HTTPS for external connections
    - toFQDNs:
        - matchName: "cloud.${SECRET_DOMAIN}"
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
