---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: nextcloud-database-postgres17
  namespace: cloud
spec:
  # Reference to the cluster
  cluster:
    name: postgres17 # Name of your PostgreSQL cluster
  # Database name
  name: nextcloud
  # Database owner (user)
  owner: nextcloud
  # Optional configurations
  connectionLimit: 100
  ensure: present # Make sure the database exists (default)
