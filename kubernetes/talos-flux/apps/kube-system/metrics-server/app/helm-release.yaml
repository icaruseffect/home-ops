---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
spec:
  interval: 30m
  chart:
    spec:
      chart: metrics-server
      version: 3.x
      sourceRef:
        kind: HelmRepository
        name: metrics-server-charts
        namespace: flux-system
      interval: 30m
  values:
    args:
      - --kubelet-certificate-authority=/etc/ssl/certs/ca.crt
    extraVolumes:
      - name: kube-root-ca
        configMap:
          name: kube-root-ca.crt
    extraVolumeMounts:
      - name: kube-root-ca
        mountPath: /etc/ssl/certs
        readOnly: true
    metrics:
      enabled: true
    serviceMonitor:
      enabled: true
