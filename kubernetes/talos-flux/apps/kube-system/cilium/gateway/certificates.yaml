---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cert-manager.io/certificate_v1.json
# Per-host certificates for the cilium-gateway listeners. One Certificate per
# host so a single failing ACME challenge cannot block renewal of the others.
# Hostnames use \${SECRET_DOMAIN}; substitute manually when kubectl-applying
# (kustomize-controller is scaled to 0).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gw-auth.${SECRET_DOMAIN}-tls
  namespace: kube-system
spec:
  secretName: gw-auth.${SECRET_DOMAIN}-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - auth.${SECRET_DOMAIN}
---
