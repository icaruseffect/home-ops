---
# Cilium Gateway terminating TLS for all exposed hosts. One HTTPS listener
# per host (SNI) so each host's certificate renews independently; the
# certificates live in certificates.yaml next to this file. The `http`
# listener carries plain HTTP for every host (matches the old Ingress
# behavior with ingress.cilium.io/force-https: disabled).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cilium-gateway
  namespace: kube-system
  labels:
    cilium.io/gateway: "true"
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https-auth.${SECRET_DOMAIN}
      hostname: auth.${SECRET_DOMAIN}
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: gw-auth.${SECRET_DOMAIN}-tls
    - name: https-alertmanager.${SECRET_DOMAIN}
      hostname: alertmanager.${SECRET_DOMAIN}
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: gw-alertmanager.${SECRET_DOMAIN}-tls
    - name: https-prometheus.${SECRET_DOMAIN}
      hostname: prometheus.${SECRET_DOMAIN}
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
