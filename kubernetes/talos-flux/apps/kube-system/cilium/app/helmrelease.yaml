---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cilium
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: *app
      # minor pinned, patch floats: 1.20.3+ carries the endpoint GC/ADS
      # fixes for the recurring L7-policy wedge; CVE patches land too
      version: 1.20.x
      sourceRef:
        kind: HelmRepository
        name: cilium-charts
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    # single-node agent restore takes ~5-10m; helm's 5m default burned all
    # remediation retries into a rollback on the first 1.20.4 attempt
    timeout: 15m
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
      remediateLastFailure: true
    preserveValues: false
  uninstall:
    keepHistory: false
  valuesFrom:
    - kind: ConfigMap
      name: cilium-helm-values
