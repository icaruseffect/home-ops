---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-mail-ingress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: stalwart-mail
  ingress:
    - fromEndpoints:
        - {}
      toPorts:
        - ports:
            - port: "25"
              protocol: TCP
            - port: "465"
              protocol: TCP
            - port: "587"
              protocol: TCP
            - port: "143"
              protocol: TCP
            - port: "993"
              protocol: TCP
            - port: "4190"
              protocol: TCP
