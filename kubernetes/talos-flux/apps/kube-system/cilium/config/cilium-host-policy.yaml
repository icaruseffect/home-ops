---
apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: "allow-world-to-host"
spec:
  description: "Allow ports for world access"
  nodeSelector:
    matchLabels:
      topology.kubernetes.io/zone: public
  ingress:
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
            - port: "50000"
              protocol: TCP
            - port: "50002"
              protocol: TCP
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
