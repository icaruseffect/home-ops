---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
  namespace: open-webui
spec:
  interval: 5m
  chart:
    spec:
      chart: open-webui
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: open-webui-charts
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: open-webui-values
      valuesKey: values-open-webui.yaml
